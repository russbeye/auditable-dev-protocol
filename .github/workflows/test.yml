name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.18.0", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      # The goldens compare bytes, so Windows must check out LF line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The validator parity suite still runs validate-prompt.py, which needs PyYAML.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
