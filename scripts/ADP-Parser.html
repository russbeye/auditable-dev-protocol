<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Auditable Protocol · Artifact Viewer</title>
<link rel="stylesheet" href="adp-theme.css" />
<script>
/* set theme before first paint — stored preference, else system, else dark */
(function(){try{var t=localStorage.getItem('adp-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
</head>
<body>
<div class="dropmask" id="dropmask"><div class="msg">▾ Drop protocol output to view</div></div>
<div class="wrap">

  <header class="masthead">
      <div class="eyebrow">
        <span class="tag">◢ AUDITABLE PROTOCOL</span>
        <span class="page-nav">
          <a class="page-link" href="prompt-builder.html">Prompt Builder</a>
          <span class="sep">·</span>
          <span class="page-link active" aria-current="page">Artifact Viewer</span>
        </span>
        <span class="lic">· reads the skill output · MIT</span>
      <label class="theme-toggle" title="Toggle light / dark">
        <span class="tt-icon" id="tt-icon" aria-hidden="true">☾</span>
        <span class="sw"><input type="checkbox" id="themetoggle" aria-label="Dark mode"><span class="track"></span><span class="knob"></span></span>
      </label>
    </div>

    <div class="console">
      <div class="con-head">
        <div class="term-dots"><i id="livedot"></i><i></i><i></i></div>
        <div class="con-file">source: <b id="srcname">none</b></div>
        <div class="status idle" id="status"><span class="blk"></span><span id="status-txt">IDLE</span></div>
        <!-- The spoken twin of the status pill. setSource reports every state
             to the announcer in the script below, which fills this once the
             state settles. Keep it empty here and present from load. A region
             added later can be missed by assistive technology. -->
        <div class="sr-live" id="live-status" role="status" aria-live="polite"></div>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="open">⌖ Open &amp; watch file</button>
        <button class="btn" id="reload" disabled>↻ Reload</button>
        <button class="btn" id="pastebtn">⌨ Paste</button>
        <button class="btn quiet" id="example">Load example</button>
        <button class="btn ghost" id="clear">Clear</button>
        <button class="btn" id="expandall" disabled>Expand all</button>
        <button class="btn" id="collapseall" disabled>Collapse all</button>
        <label class="auto-toggle" title="Poll the watched file for changes">
          auto
          <span class="sw"><input type="checkbox" id="autoupd" checked><span class="track"></span><span class="knob"></span></span>
        </label>
        <input type="file" id="openfile" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
      </div>
      <div class="paste-drawer" id="pastedrawer">
        <textarea id="pastearea" placeholder="Paste the protocol's markdown output here — it renders live as you type or paste."></textarea>
      </div>
    </div>
  </header>

  <div class="grid">
    <aside>
      <div class="toc-wrap">
        <nav class="toc">
          <div class="toc-head"><span>◳ Contents</span><span class="count" id="toc-count">0</span></div>
          <ol id="toc-list"></ol>
          <div class="toc-empty" id="toc-empty">No sections yet. Open, drop, or paste protocol output to populate.</div>
        </nav>
      </div>
    </aside>

    <main id="content"></main>
  </div>

  <div class="foot">
    <span>AUDITABLE-DEV-PROTOCOL</span>
    <span id="foot-mode">schema_version 1.0</span>
  </div>
</div>

<!-- The toast doubles as the page's live region, so every toast message is
     spoken as well as shown. The attributes sit in the static markup because
     a region added later can be missed by assistive technology. The theme
     hides the toast with opacity, never display, which keeps the region in
     the accessibility tree. -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="adp-prompt-lib.js"></script>
<script src="adp-parser-lib.js"></script>
<script>
(function(){
  "use strict";
  const $ = (s,r=document)=>r.querySelector(s);
  const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));

  const {createStatusAnnouncer} = window.ADPPromptLib;
  const {esc, escAttr, parseSections, sectionKeys, metaFor, renderMarkdown, renderDecisionLog, dlStatusCounts} = window.ADPParserLib;

  /* =========================================================
     DL-003  State preserved across live re-renders
     ========================================================= */
  const collapsed = new Set();   // keys of collapsed sections
  let dlFilter = null;           // active decision-log status bucket, or null for all
  let lastHashes = new Map();    // key -> body hash (to flash only true changes)
  let currentText = '';
  let primed = false;            // first render done? (so initial load doesn't flash everything)

  function hash(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return h; }

  function render(isLive){
    const main=$('#content'), tocList=$('#toc-list'), tocEmpty=$('#toc-empty');
    if(!currentText.trim()){
      main.innerHTML = emptyState();
      tocList.innerHTML=''; tocEmpty.style.display='block'; $('#toc-count').textContent='0';
      setControlsEnabled(false);
      return;
    }
    const {secs}=parseSections(currentText);
    if(!secs.length){
      main.innerHTML = `<div class="empty-state"><div class="es-mark">⌑</div><h2>No protocol sections found</h2><p>The text loaded, but no <code>## Section</code> headers were detected. The viewer keys off level-2 markdown headings like <code>## Problem Statement</code> or <code>## Decision Log</code>.</p></div>`;
      tocList.innerHTML=''; tocEmpty.style.display='block'; $('#toc-count').textContent='0';
      setControlsEnabled(false);
      return;
    }

    const prevScroll = window.scrollY;
    // Replacing innerHTML silently drops keyboard focus from a toggle button.
    // We remember which section owned focus and give it back after the swap.
    const ae=document.activeElement;
    const focusKey=(ae && ae.classList && ae.classList.contains('art-toggle')) ? ae.closest('.art').id : null;
    // Strip buttons are rebuilt by innerHTML the same way toggles are, so we
    // remember the focused one by section and bucket and re-focus it below.
    const focusFilter=(ae && ae.classList && ae.classList.contains('dl-count')) ? {sec:ae.closest('.art').id, f:ae.getAttribute('data-dl-filter')} : null;
    const newHashes=new Map(); const tocItems=[]; const arrived=[];
    const keys=sectionKeys(secs);
    let bodyHtml=''; let filterHits=0;

    secs.forEach((sec,idx)=>{
      const key=keys[idx];
      const meta=metaFor(sec.title);
      const bodyRaw=sec.body.join('\n');
      const counts=meta.spine ? dlStatusCounts(bodyRaw) : null;
      if(counts && dlFilter) filterHits+=counts[dlFilter];
      let innerHtml=(meta.spine ? renderDecisionLog(bodyRaw) : renderMarkdown(bodyRaw)) || '<p style="color:var(--faint)">(empty)</p>';
      // The strip only makes sense over cards. A spine section that fell back
      // to the generic renderer has none, and its total is zero.
      if(counts && counts.total) innerHtml=dlStrip(counts)+innerHtml;
      const h=hash(bodyRaw + '|' + sec.title);
      newHashes.set(key,h);

      const changed = primed && isLive && lastHashes.get(key)!==h;
      // A key the previous render did not have is a section that just arrived.
      // The same gate that scopes the flash keeps first loads, example, paste,
      // and snapshots silent. We collect the whole tick before speaking so
      // several arrivals share one toast.
      if(primed && isLive && !lastHashes.has(key)) arrived.push(sec.title);
      const isCollapsed = collapsed.has(key);
      const cls=['art', meta.spine?'spine':'', meta.alert?'alert':'', isCollapsed?'collapsed':'', changed?'flash':''].filter(Boolean).join(' ');
      const spinePill = meta.spine?'<span class="art-spine-pill">spine</span>':'';
      const tagPill = meta.tag?`<span class="art-tag">${meta.tag}</span>`:'';

      // The toggle is a real button emitted by this template, not an
      // enhancement added after load. Live updates rebuild the markup through
      // innerHTML, so anything bolted on afterwards would be wiped on the
      // next poll tick. aria-expanded derives from the collapsed set, which
      // keeps the attribute truthful across re-renders.
      bodyHtml += `
        <section class="${cls}" id="${key}" data-key="${key}">
          <div class="art-head" data-toggle="${key}">
            <span class="art-icon">${meta.icon}</span>
            <span class="art-title">${esc(sec.title)}</span>
            ${tagPill}${spinePill}
            <button type="button" class="art-toggle" aria-expanded="${isCollapsed?'false':'true'}" aria-controls="${key}-body" aria-label="${escAttr(sec.title)} section"><span aria-hidden="true">▾</span></button>
          </div>
          <div class="art-body" id="${key}-body"><div class="md">${innerHtml}</div></div>
        </section>`;

      // The ti-open badge lets a reviewer spot outstanding decisions from the
      // TOC, so it only renders when the open count is nonzero.
      tocItems.push(`<li><a href="#${key}" data-toc="${key}"><span class="ti-icon">${meta.icon}</span><span class="ti-name">${esc(sec.title)}</span>${meta.tag?`<span class="ti-tag">${meta.tag}</span>`:''}${counts&&counts.open?`<span class="ti-tag ti-open">${counts.open} open</span>`:''}</a></li>`);
    });

    // A live update can empty the active bucket. Keeping the filter would
    // hide every card, and a pressed OTHER button can even vanish with its
    // bucket, so we clear the filter and let the honest zeros explain it.
    if(dlFilter && !filterHits) dlFilter=null;
    main.innerHTML=bodyHtml;
    tocList.innerHTML=tocItems.join('');
    tocEmpty.style.display='none';
    $('#toc-count').textContent=String(secs.length);
    lastHashes=newHashes; primed=true;
    setControlsEnabled(true);
    applyDLFilter();
    if(focusKey){
      const sec=document.getElementById(focusKey);
      // The focused section can vanish from the document mid-edit. Then the
      // focus falls back to the body, the same loss every render had before.
      if(sec) sec.querySelector('.art-toggle').focus({preventScroll:true});
    }
    if(focusFilter){
      const sec=document.getElementById(focusFilter.sec);
      const btn=sec && sec.querySelector('.dl-count[data-dl-filter="'+focusFilter.f+'"]');
      if(btn) btn.focus({preventScroll:true});
    }

    if(arrived.length){
      toast(arrived.length===1 ? 'New section: '+arrived[0]
                               : arrived.length+' new sections: '+arrived.join(', '));
    }

    // preserve scroll on live updates so the view doesn't jump
    if(isLive){ window.scrollTo(0,prevScroll); }
    scrollSpy();
  }

  function emptyState(){
    const fs = ('showOpenFilePicker' in window);
    return `<div class="empty-state">
      <div class="es-mark">◢◣◤◥</div>
      <h2>No artifacts loaded</h2>
      <p>This viewer renders the markdown the <b>auditable-dev-protocol</b> skill produces — Problem Statement, Recommendation Brief, Pre-Mortem, Decision Log, and the rest — as collapsible, navigable sections.</p>
      <p>${fs ? 'Click <code>Open &amp; watch file</code> to pick your output file — it will re-render automatically as the protocol appends more sections.' : 'Click <code>Open file</code> to load a one-shot snapshot of your output file — your browser lacks the File System Access API, so live watching is off. Paste and drag &amp; drop also work.'}</p>
      <div class="keys">drag &amp; drop a <code>.md</code> file anywhere &nbsp;·&nbsp; or <code>Load example</code> to see it in action</div>
    </div>`;
  }

  function setControlsEnabled(on){
    $('#expandall').disabled=!on; $('#collapseall').disabled=!on;
  }

  /* The audit strip for one spine section. The counts are the filter
     controls, so each one is a real button and keyboard reachable. The pill
     classes keep the status vocabulary reading the same here as on the
     cards. ALL carries the total and is the pressed state when no filter is
     active. OTHER only appears when some card's status matched no known
     keyword. The template emits every button unpressed, because
     applyDLFilter() stamps aria-pressed right after each render. */
  function dlStrip(c){
    const btn=(f,cls,label,n)=>`<button type="button" class="pill dl-count ${cls}" data-dl-filter="${f}" aria-pressed="false">${label} <b>${n}</b></button>`;
    return `<div class="dl-strip" role="group" aria-label="Filter decisions by status">`
      + btn('','p-low','ALL',c.total)
      + btn('open','p-open','OPEN',c.open)
      + btn('validated','p-ok','VALIDATED',c.validated)
      + btn('invalidated','p-bad','INVALIDATED',c.invalidated)
      + (c.other ? btn('other','p-low','OTHER',c.other) : '')
      + `</div>`;
  }

  /* =========================================================
     TOC scroll-spy
     ========================================================= */
  let spyTick=false;
  function scrollSpy(){
    const arts=$$('.art'); if(!arts.length) return;
    let activeKey=arts[0].id;
    for(const a of arts){ if(a.getBoundingClientRect().top - 130 <= 0) activeKey=a.id; else break; }
    $$('#toc-list a').forEach(el=>el.classList.toggle('active', el.getAttribute('data-toc')===activeKey));
  }
  window.addEventListener('scroll',()=>{ if(spyTick)return; spyTick=true; requestAnimationFrame(()=>{scrollSpy();spyTick=false;}); },{passive:true});

  /* =========================================================
     DL-002  Source acquisition: FS Access watch + fallbacks
     ========================================================= */
  let fileHandle=null, watchTimer=null, lastSig='', fetchUrl=null;

  /* The status pill's spoken twin. We reuse the lib's settle-then-compare
     discipline, so repeated reports of one state stay silent. Every content
     change of a watched file re-reports WATCHING, and only a real state
     change speaks. The wording mirrors the pill's states in plain words. */
  const SOURCE_SPOKEN={IDLE:'No source',WATCHING:'Watching file',LOADED:'Snapshot loaded',PASTED:'Paste mode'};
  const announceSource=createStatusAnnouncer({
    say:t=>{ $('#live-status').textContent=t; },
    // The builder's settle window. One shared feel, one fewer constant.
    debounceMs:800,
    format:s=>SOURCE_SPOKEN[s]||s
  });
  // The pill boots as IDLE in the static markup, so we seed the announcer
  // with the same state. The seed is silent and the first real transition
  // speaks, a ?file= boot included.
  announceSource('IDLE');

  function setSource(name,state){
    $('#srcname').textContent=name||'none';
    const st=$('#status'), txt=$('#status-txt'), dot=$('#livedot');
    st.className='status '+(state==='WATCHING'?'ok':state==='IDLE'?'idle':'warn');
    txt.textContent=state;
    dot.classList.toggle('live', state==='WATCHING');
    $('#foot-mode').textContent = state==='WATCHING' ? 'watching file · polling 1.5s' : (state==='PASTED'?'paste mode · live':'no build step · local files');
    announceSource(state);
  }

  function update(text, isLive){ currentText=text; render(isLive); }

  async function pollTick(){
    if(!$('#autoupd').checked) return;
    if(fetchUrl){
      try{
        const r=await fetch(fetchUrl,{cache:'no-store'});
        if(!r.ok) return;
        const text=await r.text();
        if(text!==lastSig){ lastSig=text; setSource(fetchUrl.split('/').pop()||fetchUrl,'WATCHING'); update(text,true); }
      }catch(e){ /* server gone — leave last render in place */ }
      return;
    }
    if(!fileHandle) return;
    try{
      const f=await fileHandle.getFile();
      const sig=f.lastModified+':'+f.size;
      if(sig!==lastSig){ lastSig=sig; const text=await f.text(); setSource(f.name,'WATCHING'); update(text,true); }
    }catch(e){ /* file moved/closed — leave last render in place */ }
  }
  function startWatch(){
    if(watchTimer) clearInterval(watchTimer);
    $('#reload').disabled=false;
    pollTick();
    watchTimer=setInterval(pollTick,1500);
  }

  $('#open').addEventListener('click', async ()=>{
    if(!('showOpenFilePicker' in window)){ $('#openfile').click(); return; }
    try{
      const [h]=await window.showOpenFilePicker({types:[{description:'Markdown / text',accept:{'text/markdown':['.md','.markdown'],'text/plain':['.txt']}}]});
      // A newly watched file is a first load, not an update. We drop primed so
      // its opening render neither flashes nor announces sections.
      fileHandle=h; fetchUrl=null; lastSig=''; primed=false; closePaste(); startWatch(); toast('Watching '+h.name);
    }catch(e){ /* user cancelled */ }
  });
  // Browsers without showOpenFilePicker cannot give us a handle to poll, so Open
  // falls back to this hidden input. We read one snapshot, the same way the drop
  // path does when no handle is available.
  $('#openfile').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    const text=await f.text();
    if(watchTimer){ clearInterval(watchTimer); watchTimer=null; fileHandle=null; fetchUrl=null; }
    closePaste(); setSource(f.name+' (snapshot)','LOADED'); update(text,false);
    // We reset the input so picking the same file again still fires this handler.
    e.target.value='';
  });
  $('#reload').addEventListener('click', ()=>{ lastSig=''; pollTick(); toast('Reloaded'); });

  // paste mode
  function closePaste(){ $('#pastedrawer').classList.remove('open'); }
  $('#pastebtn').addEventListener('click', ()=>{
    const d=$('#pastedrawer'); d.classList.toggle('open');
    if(d.classList.contains('open')){ $('#pastearea').focus(); }
  });
  $('#pastearea').addEventListener('input', e=>{
    if(watchTimer){ clearInterval(watchTimer); watchTimer=null; fileHandle=null; fetchUrl=null; $('#reload').disabled=true; }
    setSource('pasted text','PASTED'); update(e.target.value,false);
  });

  // drag & drop (tries to obtain a live handle for watching; else one-shot read)
  const mask=$('#dropmask'); let dragDepth=0;
  window.addEventListener('dragenter',e=>{ e.preventDefault(); dragDepth++; mask.classList.add('show'); });
  window.addEventListener('dragover',e=>{ e.preventDefault(); });
  window.addEventListener('dragleave',e=>{ dragDepth--; if(dragDepth<=0){dragDepth=0;mask.classList.remove('show');} });
  window.addEventListener('drop', async e=>{
    e.preventDefault(); dragDepth=0; mask.classList.remove('show');
    const item=e.dataTransfer.items && e.dataTransfer.items[0];
    if(item && item.getAsFileSystemHandle){
      try{ const h=await item.getAsFileSystemHandle(); if(h && h.kind==='file'){ fileHandle=h; fetchUrl=null; lastSig=''; primed=false; closePaste(); startWatch(); toast('Watching '+h.name); return; } }catch(_){}
    }
    const file=e.dataTransfer.files && e.dataTransfer.files[0];
    if(file){ const text=await file.text(); if(watchTimer){clearInterval(watchTimer);watchTimer=null;fileHandle=null;fetchUrl=null;} setSource(file.name+' (snapshot)','LOADED'); update(text,false); }
  });

  // Clear returns the viewer to its boot state. The confirm guards a live watch,
  // which Clear stops along with every other source.
  $('#clear').addEventListener('click', ()=>{
    if(!confirm('Clear the viewer?')) return;
    if(watchTimer){ clearInterval(watchTimer); watchTimer=null; }
    fileHandle=null; fetchUrl=null; lastSig='';
    $('#reload').disabled=true;
    $('#pastearea').value=''; closePaste();
    collapsed.clear(); dlFilter=null; lastHashes=new Map(); primed=false;
    setSource('','IDLE'); update('',false);
    toast('Cleared');
  });

  // expand / collapse
  // One writer moves the collapsed class, the collapsed set, and the button's
  // aria-expanded together, the same rule PB-006 set for the builder. If you
  // add collapse behavior, route it through here.
  function setCollapsed(sec,on){
    sec.classList.toggle('collapsed',on);
    if(on) collapsed.add(sec.id); else collapsed.delete(sec.id);
    sec.querySelector('.art-toggle').setAttribute('aria-expanded', on?'false':'true');
  }
  // The one writer for the filter's DOM state, the setCollapsed rule again.
  // render() calls it after every rebuild, so a live update re-applies the
  // active filter to the fresh cards instead of leaving stale classes. The
  // cards are hidden by CSS keyed on the rail classes they already carry,
  // so the filter can never disagree with the rail.
  const DL_BUCKETS=['open','validated','invalidated','other'];
  function applyDLFilter(){
    $$('.art.spine').forEach(sec=>{
      DL_BUCKETS.forEach(b=>sec.classList.toggle('dlf-'+b, b===dlFilter));
    });
    $$('.dl-count').forEach(b=>{
      b.setAttribute('aria-pressed', String((b.getAttribute('data-dl-filter')||null)===dlFilter));
    });
  }
  // The toggle button's Enter and Space arrive here as a bubbled click, so
  // the head and the button share one path.
  $('#content').addEventListener('click', e=>{
    // The strip lives in the section body, so the head path below never
    // sees its buttons. Pressing the active count again clears the filter,
    // and ALL clears it from anywhere.
    const fbtn=e.target.closest('.dl-count');
    if(fbtn){
      const f=fbtn.getAttribute('data-dl-filter')||null;
      dlFilter=(f===dlFilter)?null:f;
      applyDLFilter();
      return;
    }
    const head=e.target.closest('.art-head'); if(!head) return;
    const sec=document.getElementById(head.getAttribute('data-toggle')); if(!sec) return;
    setCollapsed(sec, !sec.classList.contains('collapsed'));
  });
  // Expand all also clears keys of sections absent from the current document,
  // so a section that later returns comes back open.
  $('#expandall').addEventListener('click', ()=>{ collapsed.clear(); $$('.art').forEach(a=>setCollapsed(a,false)); });
  $('#collapseall').addEventListener('click', ()=>{ $$('.art').forEach(a=>setCollapsed(a,true)); });

  // smooth-scroll TOC (and keep hash out of history spam)
  $('#toc-list').addEventListener('click', e=>{
    const a=e.target.closest('a'); if(!a) return;
    e.preventDefault();
    const t=document.getElementById(a.getAttribute('data-toc'));
    if(t){ t.scrollIntoView({behavior:'smooth',block:'start'}); }
  });

  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

  if(!('showOpenFilePicker' in window)){ $('#open').textContent='⌖ Open file'; $('#foot-mode').textContent='snapshots only · this browser has no File System Access'; }

  /* =========================================================
     Example: a full protocol run covering every artifact
     ========================================================= */
  const EXAMPLE = `## Problem Statement
**What the problem is:** Add server-side validation to the signup email field so malformed addresses are rejected before they reach the users table.
**What the problem is not:** This is *not* a change to client-side validation, and *not* email deliverability/verification mail.
**Human-level definition of done:** A bad address posted to signup returns a clear 422 and never creates a row.
**Confirmed by:** rbeye   **Date:** 2026-06-18

## Knowledge Gap Document
| Known | Inferred (flagged) | Cannot Determine |
|-------|--------------------|------------------|
| Signup handler parses the body at \`src/signup/handler.ts:42\` | Validation belongs in the handler, not middleware | Whether downstream relies on bad rows |
| No validation exists today | A parser beats a regex | Email volume per day |

## Open Questions (resolve before Phase 3)
1. Should plus-addressing be allowed? → RESOLVED: yes, use a parser not a regex.
2. Reject or sanitize? → ACCEPTED UNKNOWN — logged to Decision Log.

## Recommendation Brief
**Recommended approach:** Validate in the handler with a tolerant RFC-5321 parser, return 422 on failure.
**Defense:** Smallest reversible change; keeps the rule next to persistence; a parser avoids the plus-address bug a regex caused before.
**Alternatives considered:**
| Alternative | Reason rejected |
|-------------|-----------------|
| Regex check | Rejected valid plus-addressed emails last time |
| Middleware layer | Spreads the rule away from where the row is written |

## Pre-Mortem Report
Assumed: this implementation failed in production. Most likely causes:
| Failure mode | Likelihood | Impact | Developer response |
|--------------|------------|--------|--------------------|
| Parser rejects valid intl addresses | M | H | Mitigated: use a spec-tolerant parser; add intl test cases |
| 422 breaks a client expecting 400 | L | M | Rebutted: clients treat 4xx uniformly here |

## Implementation Authorization
All HIGH-likelihood items resolved: YES
Authorized by: rbeye

## Decision Log

### [DL-001] Validate in handler, not middleware
- **Decision:** Put the check in \`handler.ts\` beside the insert.
- **Alternatives considered:** Express middleware; a DB constraint.
- **Rationale:** Keeps the invariant next to the write; easiest to test.
- **Confidence:** HIGH
- **Assumptions:** Signup is the only writer of the users.email column.
- **Status:** VALIDATED

### [DL-002] Reject rather than sanitize
- **Decision:** Return 422 instead of trying to fix the address.
- **Rationale:** Silent fixes hide client bugs.
- **Confidence:** LOW
- **Assumptions:** Product wants hard rejection, not best-effort repair.
- **Status:** OPEN

## Test Adversary Document
**What passing tests prove:** Malformed addresses get 422 and create no row; valid plus-addresses pass.
**What passing tests do not prove:**
| Gap | Why untestable / untested | Risk if the assumption is wrong |
|-----|---------------------------|---------------------------------|
| Real-world intl addresses | Test set is finite | A valid user is blocked |
