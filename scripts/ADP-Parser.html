<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Auditable Protocol · Artifact Viewer</title>
<link rel="stylesheet" href="adp-theme.css" />
<script>
/* We set the theme before the first paint, so the page never flashes the wrong
   one. A stored preference wins, then the system preference, then dark. */
(function(){try{var t=localStorage.getItem('adp-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
</head>
<body>
<div class="dropmask" id="dropmask"><div class="msg">▾ Drop protocol output to view</div></div>
<div class="wrap">

  <header class="masthead">
      <div class="eyebrow">
        <span class="tag">◢ AUDITABLE PROTOCOL</span>
        <span class="page-nav">
          <a class="page-link" href="prompt-builder.html">Prompt Builder</a>
          <span class="sep">·</span>
          <span class="page-link active" aria-current="page">Artifact Viewer</span>
        </span>
        <span class="lic">· reads the skill output · MIT</span>
      <label class="theme-toggle" title="Toggle light / dark">
        <span class="tt-icon" id="tt-icon" aria-hidden="true">☾</span>
        <span class="sw"><input type="checkbox" id="themetoggle" aria-label="Dark mode"><span class="track"></span><span class="knob"></span></span>
      </label>
    </div>

    <div class="console">
      <div class="con-head">
        <div class="term-dots"><i id="livedot"></i><i></i><i></i></div>
        <div class="con-file">source: <b id="srcname">none</b></div>
        <div class="status idle" id="status"><span class="blk"></span><span id="status-txt">IDLE</span></div>
        <!-- The spoken twin of the status pill. setSource reports every state
             to the announcer in the script below, which fills this once the
             state settles. Keep it empty here and present from load. A region
             added later can be missed by assistive technology. -->
        <div class="sr-live" id="live-status" role="status" aria-live="polite"></div>
      </div>
      <div class="tabstrip" id="tabstrip" role="tablist" aria-label="Open documents" hidden></div>
      <div class="toolbar">
        <button class="btn primary" id="open">⌖ Open &amp; watch file</button>
        <button class="btn" id="reload" disabled>↻ Reload</button>
        <button class="btn" id="pastebtn">⌨ Paste</button>
        <button class="btn quiet" id="example">Load example</button>
        <button class="btn ghost" id="clear">Clear</button>
        <button class="btn" id="expandall" disabled>Expand all</button>
        <button class="btn" id="collapseall" disabled>Collapse all</button>
        <label class="auto-toggle" title="Poll watched files for changes">
          auto
          <span class="sw"><input type="checkbox" id="autoupd" checked><span class="track"></span><span class="knob"></span></span>
        </label>
        <input type="file" id="openfile" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
      </div>
      <div class="paste-drawer" id="pastedrawer">
        <textarea id="pastearea" placeholder="Paste the protocol's markdown output here — it renders live as you type or paste."></textarea>
      </div>
    </div>
  </header>

  <div class="grid">
    <aside>
      <div class="toc-wrap">
        <nav class="toc">
          <div class="toc-head"><span>◳ Contents</span><span class="count" id="toc-count">0</span></div>
          <ol id="toc-list"></ol>
          <div class="toc-empty" id="toc-empty">No sections yet. Open, drop, or paste protocol output to populate.</div>
        </nav>
      </div>
    </aside>

    <main id="content"></main>
  </div>

  <div class="foot">
    <span>AUDITABLE-DEV-PROTOCOL</span>
    <span id="foot-mode">schema_version 1.0</span>
  </div>
</div>

<!-- The toast doubles as the page's live region, so every toast message is
     spoken as well as shown. The attributes sit in the static markup because
     a region added later can be missed by assistive technology. The theme
     hides the toast with opacity, never display, which keeps the region in
     the accessibility tree. -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="adp-prompt-lib.js"></script>
<script src="adp-parser-lib.js"></script>
<script>
(function(){
  "use strict";
  const $ = (s,r=document)=>r.querySelector(s);
  const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));

  const {createStatusAnnouncer} = window.ADPPromptLib;
  const {esc, escAttr, parseSections, sectionKeys, metaFor, renderMarkdown, renderDecisionLog, dlStatusCounts} = window.ADPParserLib;

  /* =========================================================
     AV-010  Tabs: a tab object owns all per-document state
     ========================================================= */
  /* Everything that used to be a per-document module global lives on the tab
     now, and the globals are gone rather than aliased. We did that on purpose.
     The IIFE runs in strict mode, so a reference this migration missed throws
     instead of quietly sharing one value between tabs. render() still paints
     the one #content DOM, always from the active tab. */
  const tabs=[];
  let act=null;        // the active tab, or null while the workspace is empty
  let tabSeq=0;

  function newTab(props){
    const t=Object.assign({
      id:'t'+(++tabSeq),
      kind:'snap',             // 'file' | 'url' | 'paste' | 'snap'
      label:'untitled',
      handle:null, url:null,
      text:'', lastSig:'',
      hashes:new Map(),        // section key to body hash, so a flash marks a real change
      collapsed:new Set(),     // keys of collapsed sections
      dlFilter:null,           // active decision-log status bucket, or null for all
      primed:false,            // the first render is done, so a first load never flashes
      // Where a boot URL asked this tab to land. We keep the fragment until
      // the first render that produces sections, then resolve it once and
      // clear it.
      pendingFragment:null,
      scrollY:0,
      changed:false,           // a background change lit the badge, and the flash waits for activation
      needsPermission:false,   // restored handle that still needs its user gesture
      polling:false,           // a poll for this tab is in flight
    }, props);
    tabs.push(t);
    return t;
  }
  const tabById=id=>tabs.find(t=>t.id===id)||null;

  function hash(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return h; }

  function render(isLive, quietArrivals){
    const main=$('#content'), tocList=$('#toc-list'), tocEmpty=$('#toc-empty');
    if(!act || !act.text.trim()){
      main.innerHTML = emptyState();
      tocList.innerHTML=''; tocEmpty.style.display='block'; $('#toc-count').textContent='0';
      setControlsEnabled(false);
      return;
    }
    const {secs}=parseSections(act.text);
    if(!secs.length){
      main.innerHTML = `<div class="empty-state"><div class="es-mark">⌑</div><h2>No protocol sections found</h2><p>The text loaded, but no <code>## Section</code> headers were detected. The viewer keys off level-2 markdown headings like <code>## Problem Statement</code> or <code>## Decision Log</code>.</p></div>`;
      tocList.innerHTML=''; tocEmpty.style.display='block'; $('#toc-count').textContent='0';
      setControlsEnabled(false);
      return;
    }

    const prevScroll = window.scrollY;
    // Replacing innerHTML silently drops keyboard focus from a toggle button.
    // We remember which section owned focus and give it back after the swap.
    const ae=document.activeElement;
    const focusKey=(ae && ae.classList && ae.classList.contains('art-toggle')) ? ae.closest('.art').id : null;
    // Strip buttons are rebuilt by innerHTML the same way toggles are, so we
    // remember the focused one by section and bucket and re-focus it below.
    const focusFilter=(ae && ae.classList && ae.classList.contains('dl-count')) ? {sec:ae.closest('.art').id, f:ae.getAttribute('data-dl-filter')} : null;
    const focusPerma=(ae && ae.classList && ae.classList.contains('art-permalink')) ? ae.closest('.art').id : null;
    const newHashes=new Map(); const tocItems=[]; const arrived=[];
    const keys=sectionKeys(secs);
    let bodyHtml=''; let filterHits=0;

    secs.forEach((sec,idx)=>{
      const key=keys[idx];
      const meta=metaFor(sec.title);
      const bodyRaw=sec.body.join('\n');
      const counts=meta.spine ? dlStatusCounts(bodyRaw) : null;
      if(counts && act.dlFilter) filterHits+=counts[act.dlFilter];
      let innerHtml=(meta.spine ? renderDecisionLog(bodyRaw) : renderMarkdown(bodyRaw)) || '<p style="color:var(--faint)">(empty)</p>';
      // The strip only makes sense over cards. A spine section that fell back
      // to the generic renderer has none, and its total is zero.
      if(counts && counts.total) innerHtml=dlStrip(counts)+innerHtml;
      const h=hash(bodyRaw + '|' + sec.title);
      newHashes.set(key,h);

      const changed = act.primed && isLive && act.hashes.get(key)!==h;
      // A key the previous render did not have is a section that just arrived.
      // The same gate that scopes the flash keeps first loads, example, paste,
      // and snapshots silent. We collect the whole tick before speaking so
      // several arrivals share one toast.
      if(act.primed && isLive && !act.hashes.has(key)) arrived.push(sec.title);
      const isCollapsed = act.collapsed.has(key);
      const cls=['art', meta.spine?'spine':'', meta.alert?'alert':'', isCollapsed?'collapsed':'', changed?'flash':''].filter(Boolean).join(' ');
      const spinePill = meta.spine?'<span class="art-spine-pill">spine</span>':'';
      const tagPill = meta.tag?`<span class="art-tag">${meta.tag}</span>`:'';

      // The toggle and the permalink are real buttons emitted by this
      // template, not enhancements added after load. Live updates rebuild the
      // markup through innerHTML, so anything bolted on afterwards would be
      // wiped on the next poll tick. aria-expanded derives from the collapsed
      // set, which keeps the attribute truthful across re-renders.
      bodyHtml += `
        <section class="${cls}" id="${key}" data-key="${key}">
          <div class="art-head" data-toggle="${key}">
            <span class="art-icon">${meta.icon}</span>
            <span class="art-title">${esc(sec.title)}</span>
            ${tagPill}${spinePill}
            <button type="button" class="art-permalink" aria-label="Copy link to ${escAttr(sec.title)}" title="Copy link"><span aria-hidden="true">#</span></button>
            <button type="button" class="art-toggle" aria-expanded="${isCollapsed?'false':'true'}" aria-controls="${key}-body" aria-label="${escAttr(sec.title)} section"><span aria-hidden="true">▾</span></button>
          </div>
          <div class="art-body" id="${key}-body"><div class="md">${innerHtml}</div></div>
        </section>`;

      // The ti-open badge lets a reviewer spot outstanding decisions from the
      // TOC, so it only renders when the open count is nonzero.
      tocItems.push(`<li><a href="#${key}" data-toc="${key}"><span class="ti-icon">${meta.icon}</span><span class="ti-name">${esc(sec.title)}</span>${meta.tag?`<span class="ti-tag">${meta.tag}</span>`:''}${counts&&counts.open?`<span class="ti-tag ti-open">${counts.open} open</span>`:''}</a></li>`);
    });

    // A live update can empty the active bucket. Keeping the filter would hide
    // every card, and a pressed OTHER button can even vanish with its bucket.
    // So we clear the filter and let the honest zeros explain it.
    if(act.dlFilter && !filterHits) act.dlFilter=null;
    main.innerHTML=bodyHtml;
    tocList.innerHTML=tocItems.join('');
    tocEmpty.style.display='none';
    $('#toc-count').textContent=String(secs.length);
    act.hashes=newHashes; act.primed=true;
    setControlsEnabled(true);
    applyDLFilter();
    if(focusKey){
      const sec=document.getElementById(focusKey);
      // The focused section can vanish from the document mid-edit. Then the
      // focus falls back to the body, the same loss every render had before.
      if(sec) sec.querySelector('.art-toggle').focus({preventScroll:true});
    }
    if(focusFilter){
      const sec=document.getElementById(focusFilter.sec);
      const btn=sec && sec.querySelector('.dl-count[data-dl-filter="'+focusFilter.f+'"]');
      if(btn) btn.focus({preventScroll:true});
    }
    if(focusPerma){
      const sec=document.getElementById(focusPerma);
      if(sec) sec.querySelector('.art-permalink').focus({preventScroll:true});
    }

    // Activating a badged tab re-renders live so its changes flash, and it
    // passes quietArrivals. The background delivery already toasted these
    // arrivals by name, and announcing them twice would cry wolf.
    if(arrived.length && !quietArrivals){
      toast(arrived.length===1 ? 'New section: '+arrived[0]
                               : arrived.length+' new sections: '+arrived.join(', '));
    }

    // preserve scroll on live updates so the view doesn't jump
    if(isLive){ window.scrollTo(0,prevScroll); }
    // We resolve the boot fragment on the first render that has sections,
    // after the scroll restore above so the deep link wins the scroll. The
    // fragment clears even on a miss. A late landing would yank the page out
    // from under a reader once the section finally arrives.
    // Note: the behavior must stay explicit. A default scroll inherits the
    // theme's smooth scrolling. Some platforms never run a scripted smooth
    // scroll, which leaves the deep link sitting at the top.
    if(act.pendingFragment){
      const target=document.getElementById(act.pendingFragment);
      if(target && target.classList.contains('art')){
        setCollapsed(target,false);
        target.scrollIntoView({block:'start',behavior:'instant'});
      }
      act.pendingFragment=null;
    }
    scrollSpy();
  }

  function emptyState(){
    const fs = ('showOpenFilePicker' in window);
    return `<div class="empty-state">
      <div class="es-mark">◢◣◤◥</div>
      <h2>No artifacts loaded</h2>
      <p>This viewer renders the markdown the <b>auditable-dev-protocol</b> skill produces — Problem Statement, Recommendation Brief, Pre-Mortem, Decision Log, and the rest — as collapsible, navigable sections.</p>
      <p>${fs ? 'Click <code>Open &amp; watch file</code> to pick your output file — it will re-render automatically as the protocol appends more sections.' : 'Click <code>Open file</code> to load a one-shot snapshot of your output file — your browser lacks the File System Access API, so live watching is off. Paste and drag &amp; drop also work.'}</p>
      <div class="keys">drag &amp; drop a <code>.md</code> file anywhere &nbsp;·&nbsp; or <code>Load example</code> to see it in action</div>
    </div>`;
  }

  function setControlsEnabled(on){
    $('#expandall').disabled=!on; $('#collapseall').disabled=!on;
  }

  /* The audit strip for one spine section. The counts are the filter
     controls, so each one is a real button and keyboard reachable. The pill
     classes keep the status vocabulary reading the same here as on the
     cards. ALL carries the total and is the pressed state when no filter is
     active. OTHER only appears when some card's status matched no known
     keyword. The template emits every button unpressed, because
     applyDLFilter() stamps aria-pressed right after each render. */
  function dlStrip(c){
    const btn=(f,cls,label,n)=>`<button type="button" class="pill dl-count ${cls}" data-dl-filter="${f}" aria-pressed="false">${label} <b>${n}</b></button>`;
    return `<div class="dl-strip" role="group" aria-label="Filter decisions by status">`
      + btn('','p-low','ALL',c.total)
      + btn('open','p-open','OPEN',c.open)
      + btn('validated','p-ok','VALIDATED',c.validated)
      + btn('invalidated','p-bad','INVALIDATED',c.invalidated)
      + (c.other ? btn('other','p-low','OTHER',c.other) : '')
      + `</div>`;
  }

  /* =========================================================
     TOC scroll-spy
     ========================================================= */
  let spyTick=false;
  function scrollSpy(){
    const arts=$$('.art'); if(!arts.length) return;
    let activeKey=arts[0].id;
    for(const a of arts){ if(a.getBoundingClientRect().top - 130 <= 0) activeKey=a.id; else break; }
    $$('#toc-list a').forEach(el=>el.classList.toggle('active', el.getAttribute('data-toc')===activeKey));
  }
  window.addEventListener('scroll',()=>{ if(spyTick)return; spyTick=true; requestAnimationFrame(()=>{scrollSpy();spyTick=false;}); },{passive:true});

  /* =========================================================
     AV-010  Sources: one shared poll loop over every watchable tab
     ========================================================= */

  /* The status pill's spoken twin. We reuse the lib's settle-then-compare
     discipline, so repeated reports of one state stay silent. Every content
     change of a watched file re-reports WATCHING, and only a real state
     change speaks. The wording mirrors the pill's states in plain words. */
  const SOURCE_SPOKEN={IDLE:'No source',WATCHING:'Watching file',LOADED:'Snapshot loaded',PASTED:'Paste mode',CACHED:'Cached copy, click the tab to resume watching'};
  const announceSource=createStatusAnnouncer({
    say:t=>{ $('#live-status').textContent=t; },
    // The builder's settle window. One shared feel, one fewer constant.
    debounceMs:800,
    format:s=>SOURCE_SPOKEN[s]||s
  });
  // The pill boots as IDLE in the static markup, so we seed the announcer
  // with the same state. The seed is silent and the first real transition
  // speaks, a ?file= boot included.
  announceSource('IDLE');

  // A tab's state derives from what the tab is, never from a stored flag, so
  // the pill cannot disagree with the poll loop. CACHED is the restored file
  // tab that still waits for its permission click.
  function tabState(t){
    if(!t) return 'IDLE';
    if(t.kind==='url') return 'WATCHING';
    if(t.kind==='file') return (t.handle && !t.needsPermission)?'WATCHING':'CACHED';
    if(t.kind==='paste') return 'PASTED';
    return 'LOADED';
  }

  const IDLE_FOOT=('showOpenFilePicker' in window) ? 'no build step · local files' : 'snapshots only · this browser has no File System Access';

  /* The one writer for the source chrome: name, pill, live dot, footer,
     Reload, the paste drawer, and the spoken twin, all derived from the
     active tab. Every tab switch and every re-arm routes through here. */
  function syncSourceUI(){
    const state=tabState(act);
    $('#srcname').textContent=act?act.label:'none';
    const st=$('#status'), txt=$('#status-txt'), dot=$('#livedot');
    st.className='status '+(state==='WATCHING'?'ok':state==='IDLE'?'idle':'warn');
    txt.textContent=state;
    dot.classList.toggle('live', state==='WATCHING');
    $('#foot-mode').textContent =
      state==='WATCHING' ? 'watching file · polling 1.5s'
      : state==='PASTED' ? 'paste mode · live'
      : state==='CACHED' ? 'restored from cache · click the tab to watch'
      : IDLE_FOOT;
    $('#reload').disabled = state!=='WATCHING';
    // The drawer is a paste tab's editing surface, so it follows the active
    // tab's kind instead of staying a global toggle.
    const drawer=$('#pastedrawer');
    if(act && act.kind==='paste'){
      drawer.classList.add('open');
      const ta=$('#pastearea');
      if(ta.value!==act.text) ta.value=act.text;
    }else{
      drawer.classList.remove('open');
    }
    announceSource(state);
  }

  function update(text, isLive){ act.text=text; render(isLive); }

  async function pollTab(t){
    // A slow source must not double-deliver, so a tab with a poll already in
    // flight sits the tick out.
    if(t.polling) return;
    t.polling=true;
    try{
      if(t.kind==='url'){
        const r=await fetch(t.url,{cache:'no-store'});
        if(r.ok){
          const text=await r.text();
          if(text!==t.lastSig){ t.lastSig=text; deliver(t,text); }
        }
      }else if(t.kind==='file' && t.handle && !t.needsPermission){
        const f=await t.handle.getFile();
        const sig=f.lastModified+':'+f.size;
        if(sig!==t.lastSig){ t.lastSig=sig; deliver(t, await f.text()); }
      }
    }catch(e){ /* the source went away, so we leave the tab's last text in place */ }
    t.polling=false;
  }

  /* Where a change lands decides what it does. The active tab re-renders
     live, which flashes and speaks exactly as before. A background tab only
     records the new text and lights its badge; its flash waits until the
     reader activates it, diffing against the hashes of the last render that
     tab actually showed. New sections still toast right away, named for the
     tab, so a glance says which run moved. */
  function deliver(t,text){
    if(t===act){
      update(text,true);
    }else{
      const known=new Set(sectionKeys(parseSections(t.text).secs));
      const next=parseSections(text).secs;
      const keys=sectionKeys(next);
      const arrivedTitles=next.filter((s,i)=>!known.has(keys[i])).map(s=>s.title);
      t.text=text;
      t.changed=true;
      renderStrip();
      if(arrivedTitles.length){
        toast(arrivedTitles.length===1 ? 'New section in '+t.label+': '+arrivedTitles[0]
                                       : arrivedTitles.length+' new sections in '+t.label+': '+arrivedTitles.join(', '));
      }
    }
    scheduleSave();
  }

  /* One shared loop instead of a timer per tab: closing a tab is a plain
     list splice with no timer to forget, the cadence stays one knob, and a
     dead source costs one skipped iteration. Paste and snapshot tabs never
     tick, because those sources cannot change. */
  function pollAll(){
    if(!$('#autoupd').checked) return;
    tabs.forEach(t=>{
      if(t.kind==='url' || (t.kind==='file' && t.handle && !t.needsPermission)) pollTab(t);
    });
  }

  $('#open').addEventListener('click', async ()=>{
    if(!('showOpenFilePicker' in window)){ $('#openfile').click(); return; }
    try{
      const [h]=await window.showOpenFilePicker({types:[{description:'Markdown / text',accept:{'text/markdown':['.md','.markdown'],'text/plain':['.txt']}}]});
      openHandleTab(h);
    }catch(e){ /* user cancelled */ }
  });
  /* Open and a handle-bearing drop share this path. Picking a file that is
     already open focuses its tab with the fresh handle instead of opening a
     twin, so a re-pick after a restart also repairs that tab's permission.
     A new tab boots unprimed, which keeps its first render silent. */
  async function openHandleTab(h){
    for(const t of tabs){
      if(t.kind==='file' && t.handle){
        try{
          if(await h.isSameEntry(t.handle)){
            t.handle=h; t.needsPermission=false; t.lastSig='';
            idbPut(t.id,h);
            activateTab(t.id);
            pollTab(t);
            toast('Watching '+t.label);
            return;
          }
        }catch(e){ /* comparison unavailable, so we treat it as a new file */ }
      }
    }
    const t=newTab({kind:'file',handle:h,label:h.name});
    idbPut(t.id,h);
    activateTab(t.id);
    pollTab(t);
    toast('Watching '+h.name);
  }
  // Browsers without showOpenFilePicker cannot give us a handle to poll, so Open
  // falls back to this hidden input. We read one snapshot into its own tab, the
  // same way the drop path does when no handle is available.
  $('#openfile').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    const t=newTab({kind:'snap',label:f.name+' (snapshot)',text:await f.text()});
    activateTab(t.id);
    // We reset the input so picking the same file again still fires this handler.
    e.target.value='';
  });
  $('#reload').addEventListener('click', ()=>{ if(!act) return; act.lastSig=''; pollTab(act); toast('Reloaded'); });

  $('#pastebtn').addEventListener('click', ()=>{
    // On a paste tab the button toggles that tab's drawer. Anywhere else it
    // opens a fresh buffer in its own tab, so pasting never overwrites the
    // document the reader was on.
    if(act && act.kind==='paste'){
      const d=$('#pastedrawer'); d.classList.toggle('open');
      if(d.classList.contains('open')){ $('#pastearea').focus(); }
      return;
    }
    const t=newTab({kind:'paste',label:'pasted text'});
    activateTab(t.id);
    $('#pastearea').focus();
  });
  $('#pastearea').addEventListener('input', e=>{
    if(!act || act.kind!=='paste') return;
    update(e.target.value,false);
    scheduleSave();
  });

  // A drop hands us a live handle when the browser supports one, and that tab
  // watches the file from then on. Otherwise we read a single snapshot.
  const mask=$('#dropmask'); let dragDepth=0;
  window.addEventListener('dragenter',e=>{ e.preventDefault(); dragDepth++; mask.classList.add('show'); });
  window.addEventListener('dragover',e=>{ e.preventDefault(); });
  window.addEventListener('dragleave',e=>{ dragDepth--; if(dragDepth<=0){dragDepth=0;mask.classList.remove('show');} });
  window.addEventListener('drop', async e=>{
    e.preventDefault(); dragDepth=0; mask.classList.remove('show');
    const item=e.dataTransfer.items && e.dataTransfer.items[0];
    if(item && item.getAsFileSystemHandle){
      try{ const h=await item.getAsFileSystemHandle(); if(h && h.kind==='file'){ openHandleTab(h); return; } }catch(_){}
    }
    const file=e.dataTransfer.files && e.dataTransfer.files[0];
    if(file){ const t=newTab({kind:'snap',label:file.name+' (snapshot)',text:await file.text()}); activateTab(t.id); }
  });

  // Clear returns the viewer to its boot state: every tab closes and the saved
  // workspace is wiped from both stores. The confirm guards all of it.
  $('#clear').addEventListener('click', ()=>{
    if(!confirm('Close every tab and clear the saved workspace?')) return;
    // Cancel any pending save first. A debounced write landing after the wipe
    // would resurrect the workspace on the next boot.
    clearTimeout(saveTimer); saveTimer=null;
    tabs.length=0; act=null;
    idbClear();
    try{ localStorage.removeItem(WS_KEY); }catch(e){}
    $('#pastearea').value='';
    renderStrip(); syncSourceUI(); render(false);
    toast('Cleared');
  });

  /* =========================================================
     AV-010  The tab strip: one rebuild writer, tablist keys
     ========================================================= */
  /* Like render(), the strip has one writer that rebuilds the whole row and
     gives focus back afterwards, so a badge landing mid-keyboard-navigation
     cannot strand the reader. Tabs follow the manual-activation tablist
     pattern: arrows move focus, Enter or Space activates, Delete closes. */
  function renderStrip(){
    const strip=$('#tabstrip');
    const ae=document.activeElement;
    const focusTab=(ae && ae.classList && ae.classList.contains('tab')) ? ae.getAttribute('data-tab') : null;
    const focusClose=(ae && ae.classList && ae.classList.contains('tab-close')) ? ae.closest('.tab').getAttribute('data-tab') : null;
    strip.hidden=!tabs.length;
    strip.innerHTML=tabs.map(t=>{
      const on=t===act;
      return `<span class="tab" role="tab" data-tab="${t.id}" aria-selected="${on?'true':'false'}" tabindex="${on?'0':'-1'}">`
        + `<span class="tab-dot"${t.changed?'':' hidden'} aria-hidden="true"></span>`
        + `<span class="tab-label">${esc(t.label)}</span>`
        + `<button type="button" class="tab-close" tabindex="${on?'0':'-1'}" aria-label="Close ${escAttr(t.label)}"><span aria-hidden="true">×</span></button>`
        + `</span>`;
    }).join('');
    if(focusTab){ const el=strip.querySelector('.tab[data-tab="'+focusTab+'"]'); if(el) el.focus(); }
    if(focusClose){ const el=strip.querySelector('.tab[data-tab="'+focusClose+'"] .tab-close'); if(el) el.focus(); }
  }

  // Tab must reach the focused tab's own close control without activating the
  // tab, so the close button's tabindex roves with focus inside the strip.
  $('#tabstrip').addEventListener('focusin', e=>{
    const tabEl=e.target.closest('.tab'); if(!tabEl) return;
    $$('.tab-close',$('#tabstrip')).forEach(b=>{ b.tabIndex=-1; });
    const c=tabEl.querySelector('.tab-close'); if(c) c.tabIndex=0;
  });

  $('#tabstrip').addEventListener('click', e=>{
    const closeBtn=e.target.closest('.tab-close');
    if(closeBtn){ closeTab(closeBtn.closest('.tab').getAttribute('data-tab')); return; }
    const tabEl=e.target.closest('.tab');
    if(tabEl){
      const t=tabById(tabEl.getAttribute('data-tab'));
      if(t){ activateTab(t.id); rearmTab(t); }
    }
  });

  $('#tabstrip').addEventListener('keydown', e=>{
    const tabEl=e.target.closest('.tab'); if(!tabEl) return;
    const els=$$('.tab',$('#tabstrip'));
    const i=els.indexOf(tabEl);
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();
      els[(i+(e.key==='ArrowRight'?1:els.length-1))%els.length].focus();
    }else if(e.key==='Home'){ e.preventDefault(); els[0].focus(); }
    else if(e.key==='End'){ e.preventDefault(); els[els.length-1].focus(); }
    else if((e.key==='Enter'||e.key===' ') && !e.target.closest('.tab-close')){
      // Manual activation. On the close button we stand back and let the
      // native button click do the closing.
      e.preventDefault();
      const t=tabById(tabEl.getAttribute('data-tab'));
      if(t){ activateTab(t.id); rearmTab(t); }
    }else if(e.key==='Delete'||e.key==='Backspace'){
      e.preventDefault();
      closeTab(tabEl.getAttribute('data-tab'));
    }
  });

  function activateTab(id){
    const t=tabById(id); if(!t) return;
    // Saving the outgoing scroll first also covers re-activating the active
    // tab, where the restore below becomes a no-op instead of a stale jump.
    if(act) act.scrollY=window.scrollY;
    const wasChanged=t.changed;
    act=t; t.changed=false;
    renderStrip();
    syncSourceUI();
    const hadFragment=!!t.pendingFragment;
    // A badged tab renders live so its accumulated changes flash. Arrivals
    // stay quiet here, because the background delivery already toasted them
    // by name.
    render(wasChanged, true);
    // The stored scroll comes back as an explicit jump. When the render just
    // resolved a boot fragment, the deep link owns the scroll instead.
    if(!(hadFragment && !t.pendingFragment)) window.scrollTo(0, t.scrollY||0);
    scrollSpy();
    scheduleSave();
  }

  /* requestPermission needs a user gesture, so re-arming runs only from the
     strip's click and keydown paths, never from boot or the poll loop. The
     no-gesture path for already-granted profiles lives in restoreWorkspace
     via queryPermission. */
  async function rearmTab(t){
    if(!(t.kind==='file' && t.needsPermission && t.handle)) return;
    try{
      if(await t.handle.requestPermission({mode:'read'})!=='granted') return;
      t.needsPermission=false; t.lastSig='';
      syncSourceUI();
      pollTab(t);
      toast('Watching '+t.label);
    }catch(e){ /* denied, so the cached copy stays readable */ }
  }

  function closeTab(id){
    const i=tabs.findIndex(t=>t.id===id); if(i<0) return;
    const strip=$('#tabstrip');
    const hadFocus=strip.contains(document.activeElement);
    const t=tabs.splice(i,1)[0];
    idbDelete(t.id);
    if(t===act){
      act=null;
      const n=tabs[i]||tabs[i-1];
      if(n){ activateTab(n.id); }
      else{ renderStrip(); syncSourceUI(); render(false); }
    }else{
      renderStrip();
    }
    // A keyboard close must not strand focus on a removed node, so the
    // nearest surviving tab takes it.
    if(hadFocus){
      const n=tabs[i]||tabs[i-1];
      const el=n && strip.querySelector('.tab[data-tab="'+n.id+'"]');
      if(el) el.focus();
    }
    scheduleSave();
  }

  /* =========================================================
     AV-010  Persistence: localStorage for state, IndexedDB for handles
     ========================================================= */
  /* The split follows the platform's seam. The tab list, the per-tab metadata,
     the last-seen text, the paste buffers, the collapse sets, the filters, and
     the scroll positions are all JSON-serializable. Those go to one
     localStorage key, under the builder's autosave stance. Storage that is
     unavailable degrades to no persistence, never to breakage. A
     FileSystemHandle cannot survive JSON, so the handles structured-clone into
     IndexedDB, keyed by tab id. */
  const WS_KEY='adp-av-workspace';
  const SAVE_DEBOUNCE_MS=400;
  let saveTimer=null;
  function saveNow(){
    saveTimer=null;
    if(act) act.scrollY=window.scrollY;
    const data={v:1,seq:tabSeq,active:act?act.id:null,tabs:tabs.map(t=>({
      id:t.id,kind:t.kind,label:t.label,url:t.url,text:t.text,
      collapsed:Array.from(t.collapsed),dlFilter:t.dlFilter,scrollY:t.scrollY}))};
    try{ localStorage.setItem(WS_KEY,JSON.stringify(data)); }catch(e){}
  }
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,SAVE_DEBOUNCE_MS); }
  // Scrolling never schedules a save, so the flush on the way out is
  // unconditional. That is what carries the final scroll positions across a
  // restart.
  window.addEventListener('pagehide', ()=>{ clearTimeout(saveTimer); saveNow(); });

  let idbPromise=null;
  function idbOpen(){
    if(!idbPromise) idbPromise=new Promise(res=>{
      try{
        const req=indexedDB.open('adp-av',1);
        req.onupgradeneeded=()=>{ req.result.createObjectStore('handles'); };
        req.onsuccess=()=>res(req.result);
        req.onerror=()=>res(null);
      }catch(e){ res(null); }
    });
    return idbPromise;
  }
  async function idbWrite(fn){
    const db=await idbOpen(); if(!db) return;
    try{ fn(db.transaction('handles','readwrite').objectStore('handles')); }catch(e){}
  }
  function idbPut(id,h){ idbWrite(st=>st.put(h,id)); }
  function idbDelete(id){ idbWrite(st=>st.delete(id)); }
  function idbClear(){ idbWrite(st=>st.clear()); }
  async function idbHandles(){
    const db=await idbOpen(); if(!db) return new Map();
    return new Promise(res=>{
      const out=new Map();
      try{
        const cur=db.transaction('handles').objectStore('handles').openCursor();
        cur.onsuccess=()=>{ const c=cur.result; if(c){ out.set(c.key,c.value); c.continue(); } else res(out); };
        cur.onerror=()=>res(out);
      }catch(e){ res(out); }
    });
  }

  /* Rebuilds the tab set from the last save and answers with the tab that
     should boot active. Every tab renders from its cached text right away.
     A url tab re-arms by itself, and seeding lastSig with the cached text
     keeps an unchanged served file from re-delivering on the first poll. A
     file tab stays CACHED until its handle comes back and a gesture, or an
     already-granted profile, unlocks it. */
  function restoreWorkspace(){
    let data=null;
    try{ data=JSON.parse(localStorage.getItem(WS_KEY)); }catch(e){ return null; }
    if(!data || !Array.isArray(data.tabs)) return null;
    data.tabs.forEach(s=>{
      if(!s || !s.id) return;
      const text=(typeof s.text==='string')?s.text:'';
      newTab({
        id:String(s.id),
        kind:['file','url','paste','snap'].includes(s.kind)?s.kind:'snap',
        label:String(s.label||'untitled'),
        url:s.url||null, text,
        collapsed:new Set(Array.isArray(s.collapsed)?s.collapsed:[]),
        dlFilter:s.dlFilter||null, scrollY:s.scrollY||0,
        lastSig:s.kind==='url'?text:'',
        needsPermission:s.kind==='file',
      });
    });
    tabSeq=Math.max(tabSeq, data.seq|0);
    idbHandles().then(handles=>{
      tabs.forEach(async t=>{
        if(t.kind!=='file' || t.handle) return;
        const h=handles.get(t.id); if(!h) return;
        t.handle=h;
        try{
          if(await h.queryPermission({mode:'read'})==='granted'){
            t.needsPermission=false; t.lastSig='';
            if(t===act) syncSourceUI();
          }
        }catch(e){ /* stays CACHED until the activation click */ }
      });
    });
    return tabById(data.active)||tabs[0]||null;
  }

  // One writer moves the collapsed class, the collapsed set, and the button's
  // aria-expanded together, the same rule PB-006 set for the builder. If you
  // add collapse behavior, route it through here.
  function setCollapsed(sec,on){
    sec.classList.toggle('collapsed',on);
    if(on) act.collapsed.add(sec.id); else act.collapsed.delete(sec.id);
    sec.querySelector('.art-toggle').setAttribute('aria-expanded', on?'false':'true');
    scheduleSave();
  }
  // The one writer for the filter's DOM state, the setCollapsed rule again.
  // render() calls it after every rebuild, so a live update re-applies the
  // active filter to the fresh cards instead of leaving stale classes. The
  // cards are hidden by CSS keyed on the rail classes they already carry,
  // so the filter can never disagree with the rail.
  const DL_BUCKETS=['open','validated','invalidated','other'];
  function applyDLFilter(){
    $$('.art.spine').forEach(sec=>{
      DL_BUCKETS.forEach(b=>sec.classList.toggle('dlf-'+b, b===act.dlFilter));
    });
    $$('.dl-count').forEach(b=>{
      b.setAttribute('aria-pressed', String((b.getAttribute('data-dl-filter')||null)===act.dlFilter));
    });
  }
  /* Builds and copies the absolute link for one section. The link is the
     current document URL with the section's fragment, so a ?file= view stays
     a ?file= view for whoever opens it. The clipboard call and its fallback
     follow the builder's Copy YAML. */
  async function copySectionLink(key){
    const u=new URL(location.href); u.hash=key;
    try{ await navigator.clipboard.writeText(u.href); toast('Link copied'); }
    catch{ const ta=document.createElement('textarea'); ta.value=u.href; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('Link copied');}catch{toast('Copy failed');} ta.remove(); }
  }

  // The toggle button's Enter and Space arrive here as a bubbled click, so
  // the head and the button share one path.
  $('#content').addEventListener('click', e=>{
    // The strip lives in the section body, so the head path below never
    // sees its buttons. Pressing the active count again clears the filter,
    // and ALL clears it from anywhere.
    const fbtn=e.target.closest('.dl-count');
    if(fbtn){
      const f=fbtn.getAttribute('data-dl-filter')||null;
      act.dlFilter=(f===act.dlFilter)?null:f;
      applyDLFilter();
      scheduleSave();
      return;
    }
    // The permalink sits inside the head, so its click would otherwise fall
    // through to the collapse branch below. We return first. The copy never
    // moves the reader or the address bar.
    const pbtn=e.target.closest('.art-permalink');
    if(pbtn){
      copySectionLink(pbtn.closest('.art').id);
      return;
    }
    const head=e.target.closest('.art-head'); if(!head) return;
    const sec=document.getElementById(head.getAttribute('data-toggle')); if(!sec) return;
    setCollapsed(sec, !sec.classList.contains('collapsed'));
  });
  // Expand all also clears keys of sections absent from the current document,
  // so a section that later returns comes back open.
  $('#expandall').addEventListener('click', ()=>{ act.collapsed.clear(); $$('.art').forEach(a=>setCollapsed(a,false)); });
  $('#collapseall').addEventListener('click', ()=>{ $$('.art').forEach(a=>setCollapsed(a,true)); });

  // Smooth-scroll TOC. replaceState keeps the address bar on the section the
  // reader chose, without adding a history entry per click. Back still leaves
  // the page in one step. The bare fragment keeps the path and the ?file=
  // query intact.
  $('#toc-list').addEventListener('click', e=>{
    const a=e.target.closest('a'); if(!a) return;
    e.preventDefault();
    const key=a.getAttribute('data-toc');
    const t=document.getElementById(key);
    if(t){ t.scrollIntoView({behavior:'smooth',block:'start'}); history.replaceState(null,'','#'+key); }
  });

  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

  if(!('showOpenFilePicker' in window)){ $('#open').textContent='⌖ Open file'; $('#foot-mode').textContent='snapshots only · this browser has no File System Access'; }

  /* =========================================================
     Example: a full protocol run covering every artifact
     ========================================================= */
  const EXAMPLE = `## Problem Statement
**What the problem is:** Add server-side validation to the signup email field so malformed addresses are rejected before they reach the users table.
**What the problem is not:** This is *not* a change to client-side validation, and *not* email deliverability/verification mail.
**Human-level definition of done:** A bad address posted to signup returns a clear 422 and never creates a row.
**Confirmed by:** rbeye   **Date:** 2026-06-18

## Knowledge Gap Document
| Known | Inferred (flagged) | Cannot Determine |
|-------|--------------------|------------------|
| Signup handler parses the body at \`src/signup/handler.ts:42\` | Validation belongs in the handler, not middleware | Whether downstream relies on bad rows |
| No validation exists today | A parser beats a regex | Email volume per day |

## Open Questions (resolve before Phase 3)

2. Reject or sanitize? → ACCEPTED UNKNOWN — logged to Decision Log.

## Recommendation Brief

**Defense:** Smallest reversible change; keeps the rule next to persistence; a parser avoids the plus-address bug a regex caused before.
**Alternatives considered:**
| Alternative | Reason rejected |
|-------------|-----------------|
| Regex check | Rejected valid plus-addressed emails last time |
| Middleware layer | Spreads the rule away from where the row is written |

## Pre-Mortem Report
Assumed: this implementation failed in production. Most likely causes:
| Failure mode | Likelihood | Impact | Developer response |
|--------------|------------|--------|--------------------|
| Parser rejects valid intl addresses | M | H | Mitigated: use a spec-tolerant parser; add intl test cases |
| 422 breaks a client expecting 400 | L | M | Rebutted: clients treat 4xx uniformly here |

## Implementation Authorization
All HIGH-likelihood items resolved: YES
Authorized by: rbeye

## Decision Log

### [DL-001] Validate in handler, not middleware
- **Decision:** Put the check in \`handler.ts\` beside the insert.
- **Alternatives considered:** Express middleware; a DB constraint.
- **Rationale:** Keeps the invariant next to the write; easiest to test.
- **Confidence:** HIGH
- **Assumptions:** Signup is the only writer of the users.email column.
- **Status:** VALIDATED

### [DL-002] Reject rather than sanitize
- **Decision:** Return 422 instead of trying to fix the address.
- **Rationale:** Silent fixes hide client bugs.
- **Confidence:** LOW
- **Assumptions:** Product wants hard rejection, not best-effort repair.
- **Status:** OPEN

## Test Adversary Document
**What passing tests prove:** Malformed addresses get 422 and create no row; valid plus-addresses pass.
**What passing tests do not prove:**

|-----|---------------------------|---------------------------------|
| Real-world intl addresses | Test set is finite | A valid user is blocked |
| Concurrent duplicate signups | Not exercised | Race could double-insert |

**Approach taken:** Tolerant parser in the handler; 422 on failure.

## 🚩 Mandatory Review Items (LOW-confidence decisions)

**Monitoring targets:**

| Rejection is rare | 422 rate on /signup | > 2% of attempts in 1h |

| GROW-6701 | DL-002 | Product confirms reject-not-sanitize | HIGH |
**Decision Log status:** OPEN — one ticket outstanding.`;

  $('#example').addEventListener('click', ()=>{
    // The example is one snapshot tab, found again by its label, so repeated
    // clicks focus it instead of piling up copies.
    let t=tabs.find(x=>x.kind==='snap' && x.label==='example.md');
    if(t){ t.text=EXAMPLE; }
    else{ t=newTab({kind:'snap',label:'example.md',text:EXAMPLE}); }
    activateTab(t.id);
    toast('Example loaded');
  });

  // theme switcher (DL-008)
  const themeCb=$('#themetoggle'), themeIcon=$('#tt-icon');
  function syncThemeUI(){
    const t=document.documentElement.getAttribute('data-theme');
    themeCb.checked=(t==='dark');
    if(themeIcon) themeIcon.textContent=(t==='dark')?'☾':'☀';
  }
  themeCb.addEventListener('change', ()=>{
    const t=themeCb.checked?'dark':'light';
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('adp-theme', t); }catch(_){}
    syncThemeUI();
  });
  syncThemeUI();

  /* Boot order matters: the saved workspace comes back first, then ?file=
     finds or creates its url tab, and the address-bar fragment attaches to
     whichever tab the boot lands on, before that tab's first render. */
  const bootFragment=(function(){ try{ return decodeURIComponent(location.hash.slice(1))||null; }catch(e){ return location.hash.slice(1)||null; } })();
  let bootTab=restoreWorkspace();
  const bootUrl=new URLSearchParams(location.search).get('file');
  if(bootUrl){
    bootTab=tabs.find(t=>t.kind==='url' && t.url===bootUrl)||null;
    if(!bootTab){
      bootTab=newTab({kind:'url',url:bootUrl,label:bootUrl.split('/').pop()||bootUrl});
      toast('Watching '+bootTab.label);
    }
  }
  if(bootTab){
    bootTab.pendingFragment=bootFragment;
    activateTab(bootTab.id);
    pollAll();
  }else{
    renderStrip(); syncSourceUI(); render(false);
  }
  // If you change this cadence, update the footer wording in syncSourceUI.
  setInterval(pollAll,1500);
})();
</script>
