<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADP · Mission Control</title>
<link rel="stylesheet" href="adp-tokens.css" />
<link rel="stylesheet" href="adp-bundle.css" />
<link rel="stylesheet" href="adp-theme.css" />
<link rel="stylesheet" href="adp-shell.css" />
<script>
/* We set the theme before the first paint, so the page never flashes the wrong
   one. A stored preference wins, then the system preference, then dark. */
(function(){try{var t=localStorage.getItem('adp-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<script type="module" src="adp-app.js"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
