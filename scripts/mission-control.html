<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADP · Mission Control</title>
<link rel="stylesheet" href="adp-theme.css" />
<link rel="stylesheet" href="adp-shell.css" />
<script>
/* We set the theme before the first paint, so the page never flashes the wrong
   one. A stored preference wins, then the system preference, then dark. */
(function(){try{var t=localStorage.getItem('adp-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
</head>
<body>
<div class="shellmask" id="shellmask"><div class="maskmsg">▾ drop an audit log to open it</div></div>
<div class="shell">
  <header>
    <span class="brand">ADP · <b>MISSION CONTROL</b></span>
    <span class="chit" id="projChit"></span>
    <!-- The viewer's source pill, for the served corpus. The state word is
         the spoken twin too: role=status reads each change, and the states
         change only on boot, a failed re-fetch, and its recovery. -->
    <span class="chit poll poll-idle" id="liveChit" role="status"><i aria-hidden="true"></i><span id="liveTxt">IDLE</span></span>
    <button type="button" class="chit click" id="themeBtn" title="Toggle light / dark"><span id="ttIcon" aria-hidden="true">☾</span> theme</button>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <button class="newtask" id="newTaskBtn">+ new task</button>
  </header>
  <div class="main">
    <aside class="rail" id="rail"></aside>
    <main class="stage">
      <section class="screen" data-s="inspector" id="scrInspector"></section>
      <section class="screen" data-s="watchboard" id="scrWatch"></section>
      <section class="screen" data-s="ledgers" id="scrLedgers"></section>
      <section class="screen" data-s="calibration" id="scrCalib"></section>
      <section class="screen" data-s="resume pack" id="scrPack"></section>
      <section class="screen nt-wide" data-s="new task" id="scrNew"></section>
    </main>
  </div>
  <footer id="foot"></footer>
</div>
<input type="file" id="openDoc" accept=".md,.markdown,.txt" multiple hidden>
<input type="file" id="openYaml" accept=".yaml,.yml" hidden>
<script src="adp-parser-lib.js"></script>
<script src="adp-index-lib.js"></script>
<script src="adp-index-builder-lib.js"></script>
<script src="adp-derive-lib.js"></script>
<script src="adp-prompt-lib.js"></script>
<script src="adp-shell-lib.js"></script>
<script>
(function(){
  "use strict";
  const S = ADPShellLib, D = ADPDeriveLib, P = ADPParserLib, B = ADPIndexBuilder, I = ADPIndexLib, PL = ADPPromptLib;
  const $ = sel => document.querySelector(sel);

  let selScreen = "inspector";
  let corpus = null;                 // {index, texts} from the seam, or null
  // One flag covers the boot load and every poll, so two corpus loads can
  // never be in flight at once and a slow one cannot land over a newer one.
  let corpusLoading = false;
  let corpusSig = "";                // signature of the corpus on screen
  let corpusStale = false;           // the last re-fetch failed; the corpus on screen is the last good one
  const docs = [];                   // opened documents, session-local
  let docSeq = 0;
  let sel = {t: null, s: null, item: null};
  let viewMode = "section", dlFilter = "all", pasteOpen = false;
  // The ledger's pill filter is corpus-scoped, so it never resets on a rail
  // selection the way the inspector's per-ticket filter does.
  let lgFilter = "all", lgConf = "all";
  let missNotice = null, bootNotice = null;
  // The loaded packs, null until the boot load answers or when it failed.
  // The selected pack is a name; null means the default, which is
  // resume-ticket when it exists, else the first in the listing.
  let packs = null, selPack = null, packText = "", copyLabel = null;
  // Collapse state for the full-log view, keyed by section key and scoped to
  // the current selection. fullJump names a section the next full-log render
  // must open and scroll to.
  const fullClosed = new Set();
  let fullJump = null;
  // Set by any link that changes what the doc pane shows, so the next render
  // scrolls back up to the nav and the content instead of leaving the reader
  // parked at the tables.
  let paneJump = false;
  // The closed group starts collapsed: it is the archive, and its count on
  // the header says how much sits inside.
  const railCollapsed = new Set(["closed"]);
  // The board's due key starts every visit at R5's order: overdue first,
  // unanchored last. The derivation pre-orders ties, and the sort is stable,
  // so the default pass leaves that order standing.
  // The ledger default sorts the ranked column, so the stable default pass
  // leaves the derivation's triage order standing, the board's rule.
  const sortState = {dec: {k: "id", d: 1}, iw: {k: "wid", d: 1}, wb: {k: "due", d: 1},
    la: {k: "status", d: 1}};
  // Which watch states the board shows. Closed starts hidden, so the board
  // opens as R5's to-do surface and the filter is how the archive joins it.
  const wbShow = new Set(["overdue", "soon", "upcoming", "unanchored"]);
  const parsed = new Map();

  // The hash is read before the corpus exists, so the selection it names
  // waits as pending until the seam resolves.
  let pendingSel = null;
  try{ pendingSel = S.hashRead(location.hash); }catch(e){}
  let booting = true;                // the boot load is in flight

  // Derivations date against the index's own build day, so a tab left open
  // overnight keeps reporting the day the data is from.
  const today = () => corpus ? corpus.index.generated : S.localDate();
  const tokenOf = t => t.id || t.dir;

  function findTarget(tok){
    if (!tok) return null;
    const doc = docs.find(d => d.key === tok);
    if (doc) return {kind: "doc", key: doc.key, ticket: doc.ticket, text: doc.text, doc};
    if (!corpus) return null;
    const t = corpus.index.tickets.find(x => x.id === tok || x.dir === tok);
    return t ? {kind: "ticket", key: tokenOf(t), ticket: t, text: corpus.texts[t.dir] || ""} : null;
  }

  /* One parse per document text. The cache holds the split sections keyed by
     the contract's section keys, plus every DL entry found in a spine
     section, first id wins — the same first-occurrence rule the harvest
     uses. */
  function parsedOf(key, text){
    const c = parsed.get(key);
    if (c && c.sig === text) return c;
    const secs = P.parseSections(text || "").secs;
    const keys = P.sectionKeys(secs);
    const byKey = {};
    secs.forEach((s, i) => { byKey[keys[i]] = s; });
    // Cards harvest from every section, not only the spine — the builder
    // does the same, and real logs keep entries in review-response sections.
    const cards = {};
    secs.forEach(s => {
      for (const e of P.parseDLEntries(s.body.join("\n")).entries){
        const hm = e.head.match(/^\[([^\]]+)\]/);
        if (hm && !(hm[1] in cards)) cards[hm[1]] = e;
      }
    });
    const out = {sig: text, byKey, cards};
    parsed.set(key, out);
    return out;
  }

  // ---- rail ----

  function railModel(){
    const groups = [];
    if (docs.length) groups.push(["opened documents", docs.map(d => ({
      key: d.key, id: d.ticket.id || d.name, date: d.ticket.date, slug: d.name,
      ribbon: {reasons: [{txt: (d.watching ? "WATCHING FILE" : "OPENED") + " · UNINDEXED", tone: "warn"}], more: 0},
      closable: true
    }))]);
    if (corpus)
      for (const [name, list] of D.railGroups(corpus.index.tickets, today()))
        groups.push([name, list.map(t => ({
          key: tokenOf(t), id: t.id || t.dir, date: t.date, slug: t.slug,
          ribbon: D.ribbonModel(t, today()), closable: false
        }))]);
    return groups;
  }

  /* The tab strip keeps focus by never rebuilding; everything else swaps out
     through innerHTML, which drops the keyboard on the floor. We remember the
     focused control by its stable identity — its id, or the data marks the
     delegated handler itself keys on — and hand focus to the rebuilt twin.
     Matching walks candidates and compares attributes instead of composing a
     selector, so a harvested value in a mark never turns into query syntax.
     A control that did not survive the rebuild simply stays unfocused. */
  const FOCUS_MARKS = ["data-op", "data-view", "data-secstep", "data-dlf", "data-lgf", "data-lgc",
    "data-calc", "data-calk",
    "data-ws", "data-exp", "data-permalink", "data-t", "data-k", "data-key", "data-item",
    "data-close", "data-pk", "data-nadd", "data-ndel"];
  function focusMark(el){
    if (!el || !el.getAttribute) return null;
    if (el.id) return {id: el.id};
    const marks = {};
    let any = false;
    for (const a of FOCUS_MARKS){
      const v = el.getAttribute(a);
      if (v != null){ marks[a] = v; any = true; }
    }
    return any ? {marks} : null;
  }
  function refocus(mark){
    if (!mark) return;
    let el = null;
    if (mark.id) el = document.getElementById(mark.id);
    else {
      const cand = [];
      // Anchors joined the list when the board's links gained real hrefs and
      // with them the ability to hold focus through a rebuild.
      for (const tag of ["button", "th", "a"])
        cand.push.apply(cand, document.querySelectorAll(tag));
      el = cand.find(c =>
        Object.keys(mark.marks).every(a => c.getAttribute(a) === mark.marks[a]));
    }
    if (el && el.focus) try{ el.focus(); }catch(e){}
  }

  function renderRail(){
    const keep = focusMark(document.activeElement);
    $("#rail").innerHTML = S.railHtml(railModel(), sel.t, railCollapsed);
    refocus(keep);
  }

  // ---- inspector ----

  // A canonical section's chip carries its phase. A non-canonical one still
  // gets the artifact family's tag when ART recognizes the title ("Decision
  // Log — Stage 2" reads P5), and its kind otherwise, so a ledger or an ad
  // hoc note is named rather than marked §.
  function chipModel(t, key){
    const s = t.sections.find(x => x.key === key);
    const meta = s ? P.metaFor(s.title) : null;
    const label = !s ? "§"
      : s.phase != null ? "P" + s.phase
      : meta.tag || meta.kind;
    return {key, label, title: s ? s.title : key};
  }

  function defaultKey(t){
    if (t.state === "open" || t.state === "in-review"){
      const cur = D.canonicalSection(t, t.phase);
      if (cur) return cur.key;
    }
    const spine = D.canonicalSection(t, 5);
    return (spine || t.sections[0] || {key: null}).key;
  }

  // A section body renders as the decision-log card list when its title is
  // the spine, and as markdown otherwise — the one rule the pane, the full
  // log, and any future screen read.
  function sectionBodyHtml(sec, body){
    return sec ? `<div class="md">${P.metaFor(sec.title).spine
      ? P.renderDecisionLog(body) : P.renderMarkdown(body)}</div>` : "";
  }

  function renderInspector(){
    const scr = $("#scrInspector");
    const keep = focusMark(document.activeElement);
    /* A paste draft lives only in the textarea, so any rebuild — a watched
       file's poll tick included — would erase it mid-composition. We carry
       the text across the innerHTML swap; refocus carries the keyboard. */
    const pa0 = $("#pasteArea");
    const draft = pa0 ? pa0.value || "" : null;
    const keepDraft = () => {
      if (draft == null) return;
      const pa = $("#pasteArea");
      if (pa) pa.value = draft;
    };
    const tgt = findTarget(sel.t);
    const ops = S.opsRowHtml({fsa: "showOpenFilePicker" in window,
      canReload: !!(tgt && tgt.kind === "doc" && tgt.doc.handle), viewMode, pasteOpen});

    if (!tgt){
      scr.innerHTML = "<h2>inspector</h2>" + ops
        + `<div class="ipanel"><p class="dnotice">${P.esc(bootNotice || (corpus
          ? "select a ticket from the rail, or open a document"
          : "no corpus behind this page — open, paste, or drop audit logs to inspect them"))}</p></div>`;
      keepDraft(); refocus(keep);
      return;
    }
    const t = tgt.ticket;
    const pd = parsedOf(tgt.kind === "doc" ? tgt.key : t.dir, tgt.text);

    if (!t.sections.length){
      scr.innerHTML = `<h2>inspector <span class="isub">${P.esc(t.dir)}</span></h2>` + ops
        + S.tickheadHtml({title: t.id || t.dir, chits: tgt.kind === "doc"
          ? [{txt: tgt.doc.watching ? "watching · live" : "opened · one-shot"}, {txt: "unindexed"}]
          : [{txt: t.state + " · " + t.state_source}]})
        + (tgt.kind === "doc"
          ? S.rawPaneHtml({heading: t.dir, raw: (tgt.text || "").slice(0, 4000)})
          : `<div class="ipanel"><p class="dnotice">this ticket has no audit log yet — only its prompt or other files sit in the directory.</p></div>`);
      keepDraft(); refocus(keep);
      return;
    }

    // An item-only deep link lands on the item's owning section, so key
    // drift in the s token never strands a link that names a real item.
    if (sel.item && !sel.s){
      const cs = D.citingSections(t, sel.item);
      if (cs.length) sel.s = cs[0];
    }
    if (!sel.s && !sel.item) sel.s = defaultKey(t);
    const entries = D.sectionEntries(t);
    const states = {};
    entries.forEach(en => { states[en.key] = D.sectionState(t, en, today()); });
    if (sel.s && !states[sel.s]){
      missNotice = `section "${sel.s}" was not found in this log — the link may predate a retitle.`;
      sel.s = defaultKey(t);
    }

    const chits = [{txt: t.state + " · " + t.state_source,
      title: "lifecycle state — declared in front matter, or inferred from section presence on legacy logs"}];
    if (tgt.kind === "doc"){
      chits.push({txt: tgt.doc.watching ? "watching · live" : tgt.doc.handle ? "cached · reload to resume" : "opened · one-shot"});
      chits.push({txt: "unindexed"});
    }
    if (t.pr) chits.push({txt: "pr " + t.pr});

    let pane;
    if (sel.item && I.RE_DL.test(sel.item)){
      const en = entries.find(x => x.key === sel.s);
      pane = S.docPaneHtml({back: en ? en.title : "sections", heading: "[" + sel.item + "]",
        notice: pd.cards[sel.item] ? null : "this entry is cited here but not present in the loaded text.",
        bodyHtml: pd.cards[sel.item] ? `<div class="md">${P.renderDLCard(pd.cards[sel.item])}</div>` : ""});
    } else {
      const en = entries.find(x => x.key === sel.s) || entries[0];
      const sec = en && !en.missing ? pd.byKey[en.key] : null;
      const body = sec ? sec.body.join("\n") : "";
      pane = S.docPaneHtml({
        heading: en ? (en.phase != null ? "phase " + en.phase + " · " + en.title : en.title) : "—",
        badge: en && en.missing ? "missing" : en && !en.canonical ? "non-canonical" : null,
        notice: missNotice || (en && en.missing
          ? "this section was never written. A missing canonical section is an attention reason on the rail." : null),
        bodyHtml: sectionBodyHtml(sec, body)
      });
    }

    let panels = "";
    if (viewMode === "full"){
      // A jump target always opens, whatever its collapse state was.
      if (fullJump) fullClosed.delete(fullJump);
      pane = S.fullLogHtml(entries.filter(en => !en.missing).map(en => {
        const sec = pd.byKey[en.key];
        const body = sec ? sec.body.join("\n") : "";
        return {key: en.key, open: !fullClosed.has(en.key),
          heading: en.phase != null ? "phase " + en.phase + " · " + en.title : en.title,
          badge: en.canonical ? null : "non-canonical",
          bodyHtml: sectionBodyHtml(sec, body)};
      }));
    } else {
      const items = D.sectionItems(t, sel.s);
      const kindOf = d => D.decisionKind(d);
      const counts = {all: items.decisions.length,
        open: items.decisions.filter(d => kindOf(d) === "open").length,
        validated: items.decisions.filter(d => kindOf(d) === "validated").length,
        invalidated: items.decisions.filter(d => kindOf(d) === "invalidated").length};
      const shown = dlFilter === "all" ? items.decisions
        : items.decisions.filter(d => kindOf(d) === dlFilter);
      const confRank = {high: 3, medium: 2, low: 1};
      const decRows = D.sortRows(shown, sortState.dec.k, sortState.dec.d, {
        id: d => d.id, title: d => d.title, conf: d => confRank[P.dlConfKind(d.confidence)] || 0,
        status: d => kindOf(d), watch: d => (D.coveringWatch(t, d.id) || {wid: ""}).wid,
        cited: d => D.citingSections(t, d.id).length
      }).map(d => {
        // A settled row shows how its watch ended, so the empty watch column
        // never reads as data loss once coverage has closed.
        const sw = D.settledWatch(t, d.id);
        return {id: d.id, title: d.title,
          // The chip stays single-word, the same rule the DL card pills follow.
          // The demoted prose still reads in the doc pane's confidence note row.
          conf: P.dlChipSplit(d.confidence).word,
          confKind: P.dlConfKind(d.confidence),
          statusKind: kindOf(d),
          watch: (D.coveringWatch(t, d.id) || {wid: null}).wid,
          settled: sw && {wid: sw.wid, outcome: sw.outcome, closed: sw.closed},
          chips: D.citingSections(t, d.id).map(k => chipModel(t, k)),
          hl: sel.item === d.id};
      });
      const en = entries.find(x => x.key === sel.s);
      const label = en ? en.title : "this section";
      if (items.decisions.length)
        panels += S.decisionsPanelHtml({label, sort: sortState.dec,
          pills: S.pillsHtml(counts, dlFilter), rows: decRows});
      const wRows = D.sortRows(items.watches, sortState.iw.k, sortState.iw.d, {
        wid: w => w.wid, what: w => w.what, dl: w => (w.dl || []).join(","),
        due: w => w.anchored ? D.daysUntil(w.due, today()) : Infinity,
        state: w => D.dueState(w, today()), cited: w => D.citingSections(t, w.wid).length
      }).map(w => ({wid: w.wid, what: w.what, dls: w.dl || [],
        dueText: w.anchored ? w.due : (w.window || "relative"),
        state: D.dueState(w, today()), stateLabel: D.dueLabel(w, today()),
        chips: D.citingSections(t, w.wid).map(k => chipModel(t, k)),
        hl: sel.item === w.wid}));
      if (items.watches.length)
        panels += S.watchesPanelHtml({label, sort: sortState.iw, rows: wRows});
    }

    scr.innerHTML = `<h2>inspector <span class="isub">${P.esc(t.dir)}</span></h2>` + ops
      + S.tickheadHtml({title: t.id || t.dir, chits})
      + S.secNavHtml(entries, states, sel.s)
      + pane + panels;
    keepDraft(); refocus(keep);
    if (fullJump){
      for (const d of document.querySelectorAll(".fsec"))
        if (d.getAttribute("data-key") === fullJump && d.scrollIntoView) d.scrollIntoView();
      fullJump = null;
    }
    if (paneJump){
      const nav = document.querySelector(".secnav");
      if (nav && nav.scrollIntoView) nav.scrollIntoView();
      paneJump = false;
    }
  }

  // ---- watchboard ----

  /* The board reads the corpus index only. Opened documents are unindexed by
     the stage-4 ruling and their watches already render in the inspector, so
     a page with no corpus behind it says so instead of boarding session
     documents. */

  // A hidden board skips its rebuild and remembers that it owes one, so the
  // poll's re-renders never pay for a screen nobody is looking at. Entering
  // the tab settles the debt. The skip does not depend on the board's inputs
  // staying frozen: any change that re-renders the page marks the flag, so
  // the next entry rebuilds from whatever the data says by then.
  let wbStale = true;
  function renderWatch(){
    if (selScreen !== "watchboard"){ wbStale = true; return; }
    wbStale = false;
    const scr = $("#scrWatch");
    const keep = focusMark(document.activeElement);
    const head = `<h2>watchboard <span class="isub">overdue first · unanchored flagged, never dated · settled behind its chip</span></h2>`;
    if (!corpus){
      scr.innerHTML = head + `<div class="ipanel"><p class="dnotice">no corpus behind this page — `
        + `the watchboard reads the served corpus index. open, paste, or drop a document to see its watches in the inspector.</p></div>`;
      refocus(keep);
      return;
    }
    const wb = D.watchboardRows(corpus.index.tickets, today());
    const visible = wb.rows.filter(r => wbShow.has(r.state));
    const rows = D.sortRows(visible, sortState.wb.k, sortState.wb.d, {
      tid: r => r.tid, wid: r => r.wid, what: r => r.what,
      due: r => r.order, state: r => r.order,
      outcome: r => r.outcome ? r.outcome + " " + r.closed : ""
    }).map(r => ({tid: r.tid, wid: r.wid, what: r.what,
      // An unanchored row shows its window prose where a date would sit, so
      // the flag explains itself; the same rule the inspector's table uses.
      dueText: r.anchored ? r.due : (r.window || "relative"),
      state: r.state, stateLabel: r.label,
      outcomeText: r.closed ? r.outcome + " " + r.closed : null,
      outcomeKind: r.closed ? D.statusKind(r.outcome) : null}));
    scr.innerHTML = head
      + S.watchboardHtml({sort: sortState.wb, rows,
        live: wb.rows.length - wb.counts.closed, settled: wb.counts.closed,
        pills: S.statusPillsHtml(wb.counts, wbShow),
        // An empty table has two truths: filters hiding real rows, and a
        // corpus that never opened a watch. Say which one is happening.
        empty: wb.rows.length ? "every watch here is hidden by the status filters."
          : "no watches on record yet — no ticket in this corpus has opened an obligation table."});
    refocus(keep);
  }

  // ---- ledgers ----

  /* The ledgers read the corpus index only, like the board: opened documents
     are unindexed by the stage-4 ruling and their record renders in the
     inspector. The hidden-screen debt flag works the way the board's does. */
  let lgStale = true;
  // Every kind either classifier can return, so no entry is unreachable by pill.
  const LG_STATUS_KEYS = ["all"].concat(D.STATUS_KINDS);
  const LG_CONF_KEYS = ["all"].concat(D.CONF_KINDS);
  function renderLedgers(){
    if (selScreen !== "ledgers"){ lgStale = true; return; }
    lgStale = false;
    const scr = $("#scrLedgers");
    const keep = focusMark(document.activeElement);
    const head = `<h2>ledgers <span class="isub">the corpus's decision record · settled rulings included · watches live on the board</span></h2>`;
    if (!corpus){
      scr.innerHTML = head + `<div class="ipanel"><p class="dnotice">no corpus behind this page — `
        + `the ledgers read the served corpus index. open, paste, or drop a document to see its record in the inspector.</p></div>`;
      refocus(keep);
      return;
    }
    const lg = D.ledgerRows(corpus.index.tickets, today());
    // The pills count the whole record; the filters cut rows, never counts.
    // Both axes read the classifications the calibration screen counts by,
    // so a segment click lands exactly the entries its cell counted.
    const tally = (keys, of) => {
      const c = {all: lg.decisions.length};
      keys.forEach(k => { c[k] = lg.decisions.filter(r => of(r) === k).length; });
      return c;
    };
    const counts = tally(LG_STATUS_KEYS.slice(1), r => r.kind);
    const confCounts = tally(LG_CONF_KEYS.slice(1), r => P.dlConfKind(r.confidence));
    const shown = lg.decisions.filter(r =>
      (lgFilter === "all" || r.kind === lgFilter)
      && (lgConf === "all" || P.dlConfKind(r.confidence) === lgConf));
    const confRank = {high: 3, medium: 2, low: 1};
    const aRows = D.sortRows(shown, sortState.la.k, sortState.la.d, {
      tid: r => r.tid, id: r => r.id, title: r => r.title,
      conf: r => confRank[P.dlConfKind(r.confidence)] || 0,
      status: r => r.rank,
      watch: r => r.watch || (r.settled ? r.settled.wid : ""),
      // A dateless card maps to Infinity, so the ascending pass keeps the
      // null-age rows last instead of letting a NaN land them mid-table.
      age: r => r.age == null ? Infinity : r.age
    }).map(r => ({tid: r.tid, id: r.id, title: r.title,
      conf: P.dlChipSplit(r.confidence).word, confKind: P.dlConfKind(r.confidence),
      statusKind: r.kind, watch: r.watch, settled: r.settled,
      ageText: r.age == null ? "—" : r.age + "d"}));
    scr.innerHTML = head
      + S.assumptionLedgerHtml({sort: sortState.la, rows: aRows,
        pills: S.pillGroupHtml("status", S.pillsHtml(counts, lgFilter, "data-lgf", LG_STATUS_KEYS))
          + S.pillGroupHtml("confidence", S.pillsHtml(confCounts, lgConf, "data-lgc", LG_CONF_KEYS)),
        empty: counts.all ? "nothing under these filters — the pills count what exists."
          : "no decisions on record — no ticket in this corpus has logged an entry."});
    refocus(keep);
  }

  // ---- calibration ----

  /* The calibration screen reads the corpus index only, like the board and
     the ledgers: an opened document is unindexed, so it never counts here.
     Every number is the derive lib's; the page draws the model and nothing
     else. The bar segments are the screen's controls, and a poll tick
     rebuilds them, so a focused segment is handed to its rebuilt twin the
     way every screen's controls are. The hidden-screen debt flag works the
     way the ledgers' does. */
  let cbStale = true;
  function renderCalib(){
    if (selScreen !== "calibration"){ cbStale = true; return; }
    cbStale = false;
    const scr = $("#scrCalib");
    const keep = focusMark(document.activeElement);
    if (!corpus){
      scr.innerHTML = S.calibrationHtml({model: null, notice: "no corpus behind this page — "
        + "calibration reads the served corpus index. open, paste, or drop a document to see its record in the inspector."});
      refocus(keep);
      return;
    }
    scr.innerHTML = S.calibrationHtml({model: D.calibrationModel(corpus.index.tickets, today()),
      notice: "no decisions on record — no ticket in this corpus has logged an entry."});
    refocus(keep);
  }

  // A segment lands the ledger on its cell: both filters set, the screen
  // switched, and focus handed to the status pill that now reads on, so the
  // keyboard arrives where the eye does instead of staying on a hidden bar.
  function openLedgerCell(seg){
    lgConf = seg.getAttribute("data-calc");
    lgFilter = seg.getAttribute("data-calk");
    selScreen = "ledgers";
    render();
    renderLedgers();
    const pill = Array.from(document.querySelectorAll(".fpill"))
      .find(p => p.getAttribute("data-lgf") === lgFilter);
    if (pill && pill.focus) pill.focus();
    syncHash();
  }

  // ---- resume pack ----

  /* The pack screen reads the corpus index only, like the board and the
     ledgers: an opened document is unindexed, so a pack never fills from
     one. The hidden-screen debt flag works the way the board's does. The
     three notices come in order of what is missing: packs, corpus, then an
     indexed ticket to fill from. */
  let pkStale = true;
  function renderPack(){
    if (selScreen !== "resume pack"){ pkStale = true; return; }
    pkStale = false;
    const scr = $("#scrPack");
    const keep = focusMark(document.activeElement);
    if (!packs || !packs.length){
      scr.innerHTML = S.packScreenHtml({packs: null, notice: packs
        ? "the packs directory is empty — drop a .pack.md file into the skill's packs/ directory and reload."
        : "no packs behind this page — packs load from the skill's packs/ directory through adp-serve.py (restart a server started before this page had packs routes); a page opened over file:// or with no server has none."});
      refocus(keep);
      return;
    }
    if (!packs.some(p => p.name === selPack))
      selPack = packs.some(p => p.name === "resume-ticket") ? "resume-ticket" : packs[0].name;
    const pack = packs.find(p => p.name === selPack);
    const tgt = findTarget(sel.t);
    const t = tgt && tgt.kind === "ticket" ? tgt.ticket : null;
    let notice = null;
    packText = "";
    if (!corpus) notice = "no corpus behind this page — a pack fills from the served corpus index.";
    // A corpus-wide pack reads no ticket slot, so it fills whether or not a
    // ticket is selected. Only a pack that reads one waits for the rail.
    else if (!t && S.packReadsTicket(pack.text)) notice = tgt
      ? "opened documents are unindexed — a pack fills from the corpus index. select a ticket from the rail."
      : bootNotice || "select a ticket from the rail to fill this pack.";
    else packText = S.fillPack(pack.text, S.packContext(corpus.index, t, today()));
    scr.innerHTML = S.packScreenHtml({packs, sel: selPack, file: pack.file, text: packText,
      slots: S.packSlots(pack.text), notice, copyLabel});
    refocus(keep);
  }

  // The label reports what the clipboard did, because a "copied" that
  // assumes success would hide a denied write. The outcome shows for a
  // moment and the control returns to its resting label.
  function copyPack(){
    let write;
    try{ write = navigator.clipboard.writeText(packText); }
    catch(e){ write = Promise.reject(e); }
    Promise.resolve(write).then(
      () => { copyLabel = "copied"; renderPack(); },
      () => { copyLabel = "copy failed — select the text"; renderPack(); });
    setTimeout(() => { copyLabel = null; renderPack(); }, 1200);
  }

  // ---- new task ----

  /* The builder holds one lib document and one screen-state object. The
     document is the form: every input names a dotted path into it, the
     preview is buildYaml over it, and the badge is validate over its export
     image. The screen renders on entry and on structural changes only; a
     keystroke rebuilds the side card and the preview, never the inputs, and
     no poll reaches it, so a served-file change cannot take the caret from
     a person mid-word. */
  const NT_DRAFT_KEY = "adp-mc-draft", NT_DRAFT_MS = 400;
  const blankDoc = () => { const d = PL.blankDocument(); d.task.date = S.localDate(); return d; };
  // The drawer's text is screen state, so an ops-row redraw around it (a
  // failed parse, a disarmed clear, a kept form) hands it back to the textarea.
  const freshNt = () => ({slug: "", slugEdited: false, showYaml: false, pasteOpen: false,
    pasteText: "", report: null, copyLabel: null, clearLabel: null, pending: null});
  let doc = blankDoc(), nt = freshNt();
  // The builder only writes 1.0 documents, so an adopted document carries
  // that version whatever its text said; the import report names a
  // foreign version before it is stamped.
  function adopt(parsed){
    const d = PL.normalize(parsed);
    d.schema_version = "1.0";
    // A value the select cannot show is cleared, so the form and the bytes
    // agree; the standalone's select does the same when it is assigned one.
    if (!PL.FORMATS.includes(d.output.format)) d.output.format = "";
    if (Array.isArray(d.protocol.defers))
      d.protocol.defers.forEach(x => { if (x && !PL.PHASES.includes(x.phase)) x.phase = ""; });
    return d;
  }
  const ntSlug = () => nt.slugEdited ? nt.slug : S.slugOf(doc.task.title);
  const ntIssues = () => PL.validate(PL.asExported(JSON.parse(JSON.stringify(doc))));
  function ntModel(){
    const slug = ntSlug();
    return {slug, dir: S.promptDir(doc, slug), issues: ntIssues(), yaml: PL.buildYaml(doc),
      showYaml: nt.showYaml, pasteOpen: nt.pasteOpen, pasteText: nt.pasteText, report: nt.report,
      copyLabel: nt.copyLabel, clearLabel: nt.clearLabel,
      pending: nt.pending ? nt.pending.label : null};
  }
  function renderNew(){
    const keep = focusMark(document.activeElement);
    $("#scrNew").innerHTML = S.builderHtml(doc, ntModel());
    refocus(keep);
  }
  function renderNewOps(){
    const keep = focusMark(document.activeElement);
    $("#ntOps").innerHTML = S.builderOpsHtml(ntModel());
    refocus(keep);
  }
  function renderNewSide(){
    const keep = focusMark(document.activeElement);
    const m = ntModel();
    $("#ntSide").innerHTML = S.builderSideHtml(m);
    const pre = $("#ntYamlPre");
    if (pre) pre.textContent = m.yaml;
    refocus(keep);
  }
  function showNew(){ selScreen = "new task"; render(); syncHash(); }

  // A dotted path into the document; a numeric segment indexes a list.
  function setPath(path, v){
    const ks = path.split(".");
    let o = doc;
    for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
    o[ks[ks.length - 1]] = v;
  }
  function getList(list){
    if (list === "protocol.defers") return doc.protocol.defers || (doc.protocol.defers = []);
    const ks = list.split(".");
    return ks.length === 2 ? doc[ks[0]][ks[1]] : doc[ks[0]];
  }
  function ntAddRow(list){
    getList(list).push(S.blankRow(list));
    renderNew(); ntDraft();
    // The keyboard lands in the row it asked for, as the standalone does.
    const row = `${list}.${getList(list).length - 1}`;
    const first = Array.from(document.querySelectorAll(".nt-in")).find(el => {
      const f = el.getAttribute("data-nf") || "";
      return f === row || f.indexOf(row + ".") === 0;
    });
    if (first && first.focus) try{ first.focus(); }catch(e){}
  }
  function ntDelRow(path){
    const i = path.lastIndexOf(".");
    const list = path.slice(0, i), at = Number(path.slice(i + 1));
    getList(list).splice(at, 1);
    // An absent defers key means nothing is deferred, so an emptied editor
    // drops the key and the export stays byte-identical to a pre-editor one.
    if (list === "protocol.defers" && !doc.protocol.defers.length) delete doc.protocol.defers;
    renderNew(); ntDraft();
  }

  // ---- draft ----
  // One implicit draft under the shell's own key, the standalone's stance:
  // storage that is unavailable degrades to no persistence, never to
  // breakage. A typing pause saves; a tab close mid-pause flushes.
  let ntTimer = null;
  function ntDraftNow(){
    ntTimer = null;
    try{ localStorage.setItem(NT_DRAFT_KEY, JSON.stringify({doc, slug: nt.slug, slugEdited: nt.slugEdited})); }catch(e){}
  }
  function ntDraft(){ clearTimeout(ntTimer); ntTimer = setTimeout(ntDraftNow, NT_DRAFT_MS); }
  function ntDraftDelete(){
    clearTimeout(ntTimer); ntTimer = null;
    try{ localStorage.removeItem(NT_DRAFT_KEY); }catch(e){}
  }
  function ntRestore(){
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(NT_DRAFT_KEY)); }
    catch(e){ ntDraftDelete(); return; }
    if (!d || typeof d !== "object") return;
    // A draft an older shape wrote is adopted as far as normalize reads it;
    // one that cannot be read at all is dropped, and the screen boots blank.
    try{
      doc = adopt(d.doc);
      nt.slug = String(d.slug || ""); nt.slugEdited = !!d.slugEdited && !!nt.slug;
    }catch(e){ ntDraftDelete(); doc = blankDoc(); nt = freshNt(); }
  }
  window.addEventListener("pagehide", () => { if (ntTimer != null){ clearTimeout(ntTimer); ntDraftNow(); } });

  // ---- import and export ----
  const isYamlName = name => /\.ya?ml$/i.test(String(name || ""));
  const isObj = x => x && typeof x === "object" && !Array.isArray(x);
  /* An import adopts a document only after a clean parse, so a text that is
     not YAML leaves the form as it was and says so. What could not be placed
     is reported: the keys the parser skipped and the keys the schema does
     not know, in the standalone's wording. */
  function importPrompt(text, source){
    if (!String(text).trim()){ nt.report = {tone: "warn", text: "nothing to import — paste YAML first."}; renderNewOps(); return false; }
    const skipped = [];
    let obj = null;
    try{ obj = PL.parseYAML(text, skipped); }catch(e){ obj = null; }
    if (!isObj(obj) || !Object.keys(obj).length){
      nt.report = {tone: "warn", text: `couldn't parse ${source} as YAML — check indentation and structure.`};
      renderNewOps(); showNew();
      return false;
    }
    const issues = [];
    if ("schema_version" in obj && String(obj.schema_version) !== "1.0")
      issues.push(`schema_version is "${String(obj.schema_version)}" (this builder writes 1.0); fields may not line up`);
    issues.push.apply(issues, skipped);
    issues.push.apply(issues, S.unknownKeys(obj));
    issues.push.apply(issues, S.unknownValues(obj));
    replaceForm(source, () => {
      doc = adopt(obj);
      nt.slugEdited = false; nt.slug = ""; nt.pasteOpen = false; nt.pasteText = "";
      nt.report = issues.length
        ? {tone: "warn", text: `imported ${source} with ${issues.length} issue${issues.length === 1 ? "" : "s"}: ${issues.join("; ")}`}
        : {tone: "ok", text: `imported ${source} — all recognized fields.`};
    });
    return true;
  }
  function ntExample(){
    replaceForm("the example", () => {
      doc = adopt(PL.exampleDocument());
      nt.slugEdited = false; nt.slug = ""; nt.report = null;
    });
  }
  /* A form in progress is not replaced on a drop, an open, a paste, or the
     example without a word: the question waits in the ops row with a
     replace and a keep button, and the old draft stands until the reader
     answers. A blank form takes the document at once. */
  // Dirty means the export differs: a restored draft has normalize's key
  // order and would never equal the blank object graph, but its bytes do.
  const dirty = () => nt.slugEdited || PL.buildYaml(doc) !== PL.buildYaml(blankDoc());
  function replaceForm(label, apply){
    const go = () => { nt.pending = null; apply(); renderNew(); showNew(); ntDraftNow(); };
    if (!dirty()){ go(); return; }
    nt.pending = {label, go};
    renderNewOps(); showNew();
  }
  // Clear needs a second click inside the window; the first arms the button
  // in place and the timer disarms it. No modal: one blocks the page.
  function ntClear(){
    if (nt.clearLabel){
      ntDraftDelete();
      doc = blankDoc(); nt = freshNt();
      renderNew();
      return;
    }
    nt.clearLabel = "confirm clear";
    renderNewOps();
    setTimeout(() => { if (nt.clearLabel){ nt.clearLabel = null; renderNewOps(); } }, 1200);
  }
  // The label reports what the clipboard did, the pack screen's pattern.
  function ntCopy(){
    let write;
    try{ write = navigator.clipboard.writeText(PL.buildYaml(doc)); }
    catch(e){ write = Promise.reject(e); }
    Promise.resolve(write).then(
      () => { nt.copyLabel = "copied"; renderNewSide(); },
      () => { nt.copyLabel = "copy failed — select the text"; renderNewSide(); });
    setTimeout(() => { nt.copyLabel = null; renderNewSide(); }, 1200);
  }
  function ntDownload(){
    const id = String(doc.task.id || "").replace(/[^A-Za-z0-9_.-]/g, "-") || "prompt";
    const blob = new Blob([PL.buildYaml(doc)], {type: "text/yaml"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = id + ".yaml";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ---- chrome ----

  // The tab strip is built once. Renders flip state on the buttons in place,
  // so a focused tab keeps its focus across every switch.
  $("#tabs").innerHTML = S.tabsHtml(selScreen);

  function render(){
    document.querySelectorAll(".mtab").forEach(tab => {
      const on = tab.getAttribute("data-s") === selScreen;
      tab.classList.toggle("is-on", on);
      tab.setAttribute("aria-selected", on ? "true" : "false");
    });
    $("#newTaskBtn").classList.toggle("is-on", selScreen === "new task");
    document.querySelectorAll(".screen").forEach(sec =>
      sec.classList.toggle("is-on", sec.getAttribute("data-s") === selScreen));
    const theme = document.documentElement.getAttribute("data-theme");
    $("#ttIcon").textContent = theme === "dark" ? "☾" : "☀";
    $("#projChit").textContent = S.projectChitText(corpus ? corpus.index : null);
    syncLive();
    $("#foot").textContent = S.footerText(corpus ? corpus.index : null);
  }

  /* Every screen syncs, so a reload lands where the reader was. The
     inspector writes no view token, which keeps its hashes byte-identical
     with every link minted before the token existed. */
  function syncHash(){
    // The boot render runs before the seam resolves, and the deep link the
    // boot is about to honor must survive that first pass untouched. After
    // the boot the URL follows the reader; a ticket link still waiting for
    // its corpus rides along until the reader selects something.
    if (booting) return;
    const pend = !sel.t && pendingSel && pendingSel.t ? pendingSel : sel;
    const h = S.hashWrite({v: selScreen === "inspector" ? null : selScreen,
      t: pend.t, s: pend.s, item: pend.item});
    // An empty composition clears the hash. Keeping the old one would leave
    // a stale view token standing, and a reload would land on a screen the
    // reader already left.
    try{ history.replaceState(null, "", h || "#"); }catch(e){}
  }

  function renderAll(){
    render(); renderRail(); renderInspector(); renderWatch(); renderLedgers(); renderCalib(); renderPack(); syncHash();
  }

  // ---- opened documents ----

  /* An opened file runs through the same builder the corpus uses, as its own
     one-ticket corpus. The harvest is display metadata only: the document
     stays unindexed and never joins the corpus index. */
  function harvest(dir, text){
    return B.buildIndex([{path: dir + "/audit-log.md", text: String(text)}],
      {project: null, generated: today(), source: "picked"}).tickets[0];
  }

  function addDoc(name, text, watching, handle){
    const key = "doc-" + (++docSeq);
    const dir = String(name || "document").replace(/\//g, "-") || "document";
    docs.push({key, name: dir, text: String(text), ticket: harvest(dir, text),
      watching: !!watching, handle: handle || null, polling: false});
    sel = {t: key, s: null, item: null};
    dlFilter = "all"; missNotice = null; pasteOpen = false; fullClosed.clear();
    selScreen = "inspector";
    renderAll();
  }

  // A File with no filesystem handle reads once and opens as a one-shot
  // document; the input path and the handle-less drop path share it. A
  // .yaml is a prompt: it imports into the builder instead of opening.
  function readDocFile(f){
    const rd = new FileReader();
    rd.onload = () => isYamlName(f.name)
      ? importPrompt(String(rd.result), f.name)
      : addDoc(f.name, String(rd.result), false);
    rd.readAsText(f);
  }

  function updateDoc(doc, text){
    if (text === doc.text) return false;
    doc.text = String(text);
    doc.ticket = harvest(doc.name, text);
    return true;
  }

  function closeDoc(key){
    const i = docs.findIndex(d => d.key === key);
    if (i >= 0) docs.splice(i, 1);
    if (sel.t === key){ sel = {t: null, s: null, item: null}; fullClosed.clear(); }
    renderAll();
    /* The activated close button died with the rebuild, so the generic
       refocus has no twin to find and a keyboard user would land on the
       body. We hand focus on deterministically: the entry that took the
       closed one's place, else the last remaining document, else whatever
       entry or section header the rail still shows. */
    const next = docs[i] || docs[i - 1];
    let el = next ? Array.from(document.querySelectorAll(".rentry"))
      .find(b => b.getAttribute("data-key") === next.key) : null;
    if (!el) el = document.querySelector(".rentry") || document.querySelector(".railsec");
    if (el && el.focus) try{ el.focus(); }catch(e){}
  }

  async function openDocs(){
    if (!("showOpenFilePicker" in window)){ $("#openDoc").click(); return; }
    let handles;
    try{
      handles = await window.showOpenFilePicker({multiple: true,
        types: [{description: "Markdown / text", accept: {"text/markdown": [".md", ".markdown"], "text/plain": [".txt"]}}]});
    }catch(e){ return; }
    for (const h of handles){
      try{
        const f = await h.getFile();
        addDoc(f.name, await f.text(), true, h);
      }catch(e){ console.warn("open failed:", e); }
    }
  }

  async function reloadDoc(doc){
    if (!doc || !doc.handle) return;
    try{
      // The reload click is a user gesture, so a lapsed read permission can
      // be re-requested here; the poll loop never can.
      if (doc.handle.requestPermission &&
          (await doc.handle.requestPermission({mode: "read"})) !== "granted") return;
      const f = await doc.handle.getFile();
      updateDoc(doc, await f.text());
      doc.watching = true;
    }catch(e){ console.warn("reload failed:", e); }
    renderAll();
  }

  /* The shared poll, in the viewer's pattern: one loop over every watched
     document, an in-flight guard per document, and any failure flips the
     document to its cached state instead of leaving a stale "watching" chit
     standing. */
  async function pollDoc(doc){
    if (doc.polling || !doc.watching || !doc.handle) return;
    doc.polling = true;
    try{
      if (doc.handle.queryPermission &&
          (await doc.handle.queryPermission({mode: "read"})) !== "granted")
        throw new Error("read permission lapsed");
      const f = await doc.handle.getFile();
      if (updateDoc(doc, await f.text())) renderAll();
    }catch(e){
      doc.watching = false;
      console.warn("watch stopped:", e);
      renderAll();
    }
    doc.polling = false;
  }
  /* The served corpus rides the same tick. The signature is the whole
     load: the built tickets, every log body, and the generated date. So an
     unchanged tick never re-renders, a change to any served file always
     does, and a page left open past midnight rolls its day-based ages once
     instead of holding the boot date. A null load is a failure the seam has
     already traced to the console; we keep the last good corpus on screen
     and try again next tick, which is how a page whose boot load failed
     catches up once the server answers. A file:// open never polls: there
     is no server to answer, and every tick would warn. A hidden tab never
     polls either, because a full corpus fetch for a page nobody is looking
     at buys nothing; the first tick after the tab is shown catches up. */
  const sigOf = c => JSON.stringify([c.index.generated, c.index.tickets, c.texts]);
  async function pollCorpus(){
    if (corpusLoading || location.protocol === "file:" || document.visibilityState === "hidden") return;
    corpusLoading = true;
    const c = await S.loadCorpus(u => fetch(u));
    corpusLoading = false;
    corpusStale = !c && !!corpus;
    if (!c){ syncLive(); return; }
    const s = sigOf(c);
    if (s === corpusSig){ syncLive(); return; }
    corpus = c; corpusSig = s;
    if (!selSettled) settleSelection();
    renderAll();
  }

  // The view token restores the screen a reload left. A token naming no
  // real screen is ignored, so a mangled link still lands somewhere sane.
  const viewToken = () => pendingSel && pendingSel.v && S.SCREENS.includes(pendingSel.v) ? pendingSel.v : null;

  /* The first corpus to land settles the selection, whether it arrives from
     the boot load or from a later tick after a boot that failed. Until
     then a deep link naming a ticket stays pending and no notice is stated,
     because nothing is known yet about the ticket it names. A selection the
     reader made in the meantime stands: the link fills an empty selection
     and never replaces one. The screen is never touched here; the view
     token set it at boot and the reader owns it after that. */
  let selSettled = false;
  function settleSelection(){
    selSettled = true;
    if (pendingSel){
      if (pendingSel.t && !sel.t){
        const tgt = findTarget(pendingSel.t);
        if (tgt) sel = {t: pendingSel.t, s: pendingSel.s, item: pendingSel.item};
        else bootNotice = `ticket "${pendingSel.t}" is not in this corpus.`;
      }
      pendingSel = null;
    }
    // A dead deep link keeps its notice visible instead of being papered
    // over by the default selection.
    if (!sel.t && !bootNotice){
      const first = railModel().find(g => g[1].length);
      if (first) sel = {t: first[1][0].key, s: null, item: null};
    }
  }

  /* The one writer for the live pill, in the viewer's pattern: the state
     derives from what the page is, never from a stored word, so the pill
     cannot disagree with the poll. STATIC is a file:// open with no server
     to poll. IDLE is a served page with no corpus yet. CACHED is a served
     corpus whose last re-fetch failed, on screen until a tick answers.
     WATCHING is the served corpus polling every 1.5s. */
  function liveState(){
    if (location.protocol === "file:") return "STATIC";
    if (!corpus) return "IDLE";
    return corpusStale ? "CACHED" : "WATCHING";
  }
  // A live region reports every text write, so the word is written only
  // when it changes; render() calls this on every pass.
  let liveShown = "";
  function syncLive(){
    const state = liveState();
    if (state === liveShown) return;
    liveShown = state;
    $("#liveChit").className = "chit poll poll-" + (state === "WATCHING" ? "ok" : state === "CACHED" ? "warn" : "idle");
    $("#liveTxt").textContent = state;
  }
  setInterval(() => { docs.forEach(pollDoc); pollCorpus(); }, 1500);

  // ---- events ----

  $("#themeBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    S.applyTheme(document, localStorage, next);
  });
  $("#newTaskBtn").addEventListener("click", () => { selScreen = "new task"; render(); syncHash(); });

  // The click path and the keyboard path fire the same sort, so the two can
  // never disagree about what a header does.
  function thSort(sth){
    const tk = sth.getAttribute("data-t");
    const st = sortState[tk], k = sth.getAttribute("data-k");
    if (!st) return;
    st.d = st.k === k ? -st.d : 1; st.k = k;
    tk === "wb" ? renderWatch()
      : tk === "la" ? renderLedgers()
      : renderInspector();
  }

  // A th never turns Enter or Space into a click the way a button does, so
  // the sort headers get their keyboard activation dispatched by hand.
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const sth = e.target && e.target.closest ? e.target.closest(".sth") : null;
    if (sth){
      if (e.preventDefault) e.preventDefault();
      thSort(sth);
    }
  });

  // One delegated listener serves every dynamic control. Inner targets are
  // checked before the containers that hold them.
  document.addEventListener("click", e => {
    const hit = cls => e.target.closest ? e.target.closest(cls) : null;
    const tab = hit(".mtab");
    if (tab){
      selScreen = tab.getAttribute("data-s");
      render();
      if (selScreen === "watchboard" && wbStale) renderWatch();
      if (selScreen === "ledgers" && lgStale) renderLedgers();
      if (selScreen === "calibration" && cbStale) renderCalib();
      if (selScreen === "resume pack" && pkStale) renderPack();
      syncHash();
      return;
    }
    const pk = hit(".pk");
    if (pk){ selPack = pk.getAttribute("data-pk"); copyLabel = null; renderPack(); return; }
    if (e.target.id === "pasteImport"){
      const v = ($("#pasteArea") || {value: ""}).value;
      addDoc("pasted.md", v, false);
      return;
    }
    const rclose = hit(".rclose");
    if (rclose){ closeDoc(rclose.getAttribute("data-close")); return; }
    const rentry = hit(".rentry");
    if (rentry){
      sel = {t: rentry.getAttribute("data-key"), s: null, item: null};
      dlFilter = "all"; missNotice = null; fullClosed.clear();
      if (selScreen !== "resume pack") selScreen = "inspector";
      renderAll();
      return;
    }
    const railsec = hit(".railsec");
    if (railsec){
      const name = railsec.getAttribute("data-sec");
      railCollapsed.has(name) ? railCollapsed.delete(name) : railCollapsed.add(name);
      renderRail();
      return;
    }
    const back = hit(".backlink");
    if (back){ sel.item = null; paneJump = true; renderInspector(); syncHash(); return; }
    const lnk = hit(".lnk");
    if (lnk){
      try{ navigator.clipboard.writeText(location.href); }catch(err){}
      lnk.textContent = "copied";
      setTimeout(() => renderInspector(), 900);
      return;
    }
    const pill = hit(".fpill");
    if (pill){
      // The data mark says which filter the pill belongs to, so the three
      // screens never trample each other's state. The board's chips toggle
      // set membership; the other two are single-select.
      const ws = pill.getAttribute("data-ws");
      const lgf = pill.getAttribute("data-lgf");
      const lgc = pill.getAttribute("data-lgc");
      if (ws){ wbShow.has(ws) ? wbShow.delete(ws) : wbShow.add(ws); renderWatch(); }
      else if (lgf){ lgFilter = lgf; renderLedgers(); }
      else if (lgc){ lgConf = lgc; renderLedgers(); }
      else { dlFilter = pill.getAttribute("data-dlf"); renderInspector(); }
      return;
    }
    const seg = hit(".calseg");
    if (seg){ openLedgerCell(seg); return; }
    const pc = hit(".pc");
    if (pc){ sel.s = pc.getAttribute("data-key"); sel.item = null; missNotice = null; paneJump = true; renderInspector(); syncHash(); return; }
    const wbl = hit(".wbl");
    if (wbl){
      // The href exists so the keyboard can reach the link; routing stays
      // in-page, so we stop the browser's own hash jump here.
      if (e.preventDefault) e.preventDefault();
      // A watch link leaves s null on purpose: the item-only landing resolves
      // the owning section, so a retitled section never strands a board link.
      sel = {t: wbl.getAttribute("data-t"), s: null,
        item: wbl.getAttribute("data-item") || null};
      dlFilter = "all"; missNotice = null; fullClosed.clear();
      selScreen = "inspector"; paneJump = true;
      renderAll();
      return;
    }
    const wl = hit(".wl");
    if (wl){
      sel.item = wl.getAttribute("data-item");
      if (I.RE_OT.test(sel.item)){
        const tgt = findTarget(sel.t);
        const own = tgt && D.canonicalSection(tgt.ticket, 9);
        if (own) sel.s = own.key;
      }
      paneJump = true;
      renderInspector(); syncHash();
      return;
    }
    const fsum = hit(".fsum");
    if (fsum){
      // We toggle the details ourselves, so the collapse state survives the
      // next re-render instead of resetting with the markup.
      if (e.preventDefault) e.preventDefault();
      const d = fsum.closest(".fsec");
      if (d){
        d.open = !d.open;
        const k = d.getAttribute("data-key");
        if (d.open) fullClosed.delete(k); else fullClosed.add(k);
      }
      return;
    }
    const sth = hit(".sth");
    if (sth){ thSort(sth); return; }
    const dlrow = hit(".dlrow");
    if (dlrow){ sel.item = dlrow.getAttribute("data-dl"); paneJump = true; renderInspector(); syncHash(); return; }
    const nadd = hit(".nt-add");
    if (nadd){ ntAddRow(nadd.getAttribute("data-nadd")); return; }
    const ndel = hit(".nt-del");
    if (ndel){ ntDelRow(ndel.getAttribute("data-ndel")); return; }
    if (e.target.id === "ntImport"){
      nt.pasteText = ($("#ntPaste") || {value: ""}).value;
      importPrompt(nt.pasteText, "the paste");
      return;
    }
    if (e.target.id === "ntReplace"){ if (nt.pending) nt.pending.go(); return; }
    if (e.target.id === "ntKeep"){ nt.pending = null; renderNewOps(); return; }
    const op = hit(".op");
    if (op){
      const nop = op.getAttribute("data-op") || "";
      if (nop.indexOf("nt") === 0){
        if (nop === "ntopen") $("#openYaml").click();
        else if (nop === "ntpaste"){ nt.pasteOpen = !nt.pasteOpen; renderNewOps(); if (nt.pasteOpen){ const pa = $("#ntPaste"); if (pa && pa.focus) pa.focus(); } }
        else if (nop === "ntexample") ntExample();
        else if (nop === "ntclear") ntClear();
        else if (nop === "ntcopy") ntCopy();
        else if (nop === "ntdl") ntDownload();
        // The panel sits under the form, so a show scrolls the stage to
        // the bytes. The card is sticky, so hide stays in reach.
        else if (nop === "ntyaml"){ nt.showYaml = !nt.showYaml; renderNew(); if (nt.showYaml) $("#ntYaml").scrollIntoView(); }
        return;
      }
      if (op.getAttribute("data-secstep")){
        const tgt = findTarget(sel.t);
        if (!tgt) return;
        const entries = D.sectionEntries(tgt.ticket);
        const i = entries.findIndex(en => en.key === sel.s) + Number(op.getAttribute("data-secstep"));
        if (i >= 0 && i < entries.length){
          sel.s = entries[i].key; sel.item = null; missNotice = null;
          if (viewMode === "full") fullJump = sel.s;
          renderInspector(); syncHash();
        }
      } else if (op.getAttribute("data-view")){
        viewMode = op.getAttribute("data-view");
        renderInspector();
      } else if (op.getAttribute("data-exp")){
        const open = op.getAttribute("data-exp") === "open";
        document.querySelectorAll(".fsec").forEach(d => {
          d.open = open;
          const k = d.getAttribute("data-key");
          if (open) fullClosed.delete(k); else fullClosed.add(k);
        });
      } else if (op.getAttribute("data-op") === "paste"){
        pasteOpen = !pasteOpen; renderInspector();
      } else if (op.getAttribute("data-op") === "openwatch"){
        openDocs();
      } else if (op.getAttribute("data-op") === "reload"){
        const tgt = findTarget(sel.t);
        if (tgt && tgt.kind === "doc") reloadDoc(tgt.doc);
      } else if (op.getAttribute("data-op") === "copypack"){
        copyPack();
      }
    }
  });

  document.addEventListener("change", e => {
    if (e.target.id === "secSel"){
      sel.s = e.target.value; sel.item = null; missNotice = null;
      if (viewMode === "full") fullJump = sel.s;
      renderInspector(); syncHash();
      return;
    }
    if (e.target.id === "openDoc" || e.target.id === "openYaml"){
      Array.from(e.target.files || []).forEach(readDocFile);
      e.target.value = "";
      return;
    }
    const t = e.target;
    if (!t || !t.getAttribute) return;
    // A toggle flips its own label in place and never rebuilds the inputs,
    // so the keyboard stays on the box it pressed.
    const lit = () => { const lab = t.closest(".nt-tog") || t.closest(".nt-chip"); if (lab) lab.classList.toggle("is-on", !!t.checked); };
    const art = t.getAttribute("data-nart");
    if (art){
      // The chips keep the lib's artifact order whatever order they were
      // ticked in, so two forms with the same ticks export the same bytes.
      const on = new Set(doc.protocol.artifacts || []);
      t.checked ? on.add(art) : on.delete(art);
      doc.protocol.artifacts = PL.ARTIFACTS.filter(a => on.has(a));
      lit(); renderNewSide(); ntDraft();
      return;
    }
    const f = t.getAttribute("data-nf");
    if (!f) return;
    if (t.getAttribute("type") === "checkbox"){ setPath(f, !!t.checked); lit(); }
    else {
      setPath(f, t.value);
      // The placeholder color follows the value, as the standalone's does.
      if (t.tagName === "SELECT") t.classList.toggle("is-unset", !t.value);
    }
    renderNewSide(); ntDraft();
  });

  // Every text field writes the path it names; the slug writes screen state.
  // A keystroke never rebuilds the inputs, only the card and the preview.
  document.addEventListener("input", e => {
    const t = e.target;
    if (!t || !t.getAttribute) return;
    if (t.id === "ntSlug"){
      nt.slug = t.value; nt.slugEdited = !!t.value;
      renderNewSide(); ntDraft();
      return;
    }
    if (t.id === "ntPaste"){ nt.pasteText = t.value; return; }
    const f = t.getAttribute("data-nf");
    if (!f || t.getAttribute("type") === "checkbox") return;
    setPath(f, t.value);
    renderNewSide(); ntDraft();
  });

  // Drop anywhere opens the files as unindexed documents, viewer-style. A
  // drop that can hand us filesystem handles is watched from then on.
  let dragDepth = 0;
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("dragenter", () => { dragDepth++; $("#shellmask").classList.add("is-on"); });
  window.addEventListener("dragleave", () => { if (--dragDepth <= 0) $("#shellmask").classList.remove("is-on"); });
  window.addEventListener("drop", e => {
    e.preventDefault(); dragDepth = 0; $("#shellmask").classList.remove("is-on");
    const items = e.dataTransfer && e.dataTransfer.items;
    if (items && items.length && items[0].getAsFileSystemHandle){
      Array.from(items).forEach(async it => {
        try{
          const h = await it.getAsFileSystemHandle();
          if (h && h.kind === "file"){
            const f = await h.getFile();
            // A prompt is imported, not watched, so its handle is dropped.
            if (isYamlName(f.name)) importPrompt(await f.text(), f.name);
            else addDoc(f.name, await f.text(), true, h);
          }
        }catch(err){ console.warn("drop failed:", err); }
      });
      return;
    }
    Array.from(e.dataTransfer && e.dataTransfer.files || []).forEach(readDocFile);
  });

  // ---- boot ----

  /* One render path serves the boot, every tab switch, and the corpus
     arriving. The seam is async, so the first paint is the complete
     no-corpus chrome and the same render fills everything in when the
     index resolves. */
  renderAll();
  // The builder renders once here and again only on its own events; it is
  // no corpus view, so the seam and the poll never rebuild it.
  ntRestore();
  renderNew();
  corpusLoading = true;
  S.loadCorpus(u => fetch(u)).then(c => {
    corpusLoading = false;
    corpus = c;
    corpusSig = c ? sigOf(c) : "";
    // The screen the link names needs no corpus, so it is honored now. The
    // ticket it names waits for the first corpus to answer, except over
    // file://, where nothing will ever answer and the link settles now; a
    // link naming no ticket has nothing left to wait for.
    if (viewToken()) selScreen = viewToken();
    if (c || location.protocol === "file:") settleSelection();
    else if (pendingSel && !pendingSel.t) pendingSel = null;
    booting = false;
    renderAll();
  });
  // The packs load once, beside the corpus. They are the skill's own files,
  // not the working tree, so a new pack shows on the next reload rather
  // than on the corpus tick.
  S.loadPacks(u => fetch(u)).then(p => { packs = p; renderPack(); });
})();
</script>
</body>
</html>
